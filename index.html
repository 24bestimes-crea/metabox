
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BloxCraft Obby & Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f8fafc; touch-action: none; }

  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  .hud-top {
    position: fixed; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap; pointer-events: none; z-index: 15;
  }
  .pill {
    background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px;
    padding: 8px 16px; display: flex; align-items: center; gap: 14px;
    font-size: 0.88rem; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    pointer-events: auto;
  }
  .pill .coins { color: #facc15; }
  .pill .stage { color: #38bdf8; }
  .pill .pos { color: #94a3b8; font-size: 0.78rem; }

  .toolbar {
    position: fixed; top: 66px; right: 14px;
    display: flex; gap: 8px; flex-wrap: wrap; z-index: 20;
  }
  .tool-btn {
    border: none; border-radius: 12px; padding: 9px 14px;
    font-weight: 700; font-size: 0.82rem; cursor: pointer;
    color: #fff; background: rgba(30, 41, 59, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  }
  .tool-btn:hover { transform: translateY(-2px); background: rgba(51, 65, 85, 0.95); }
  .tool-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: #7dd3fc; }
  .tool-btn.warn { background: linear-gradient(135deg, #d97706, #ea580c); }

  /* Build Palette */
  #build-bar {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(125, 211, 252, 0.35);
    backdrop-filter: blur(12px); border-radius: 18px; padding: 10px 14px;
    display: none; align-items: center; gap: 8px; z-index: 25;
    box-shadow: 0 16px 35px rgba(0,0,0,0.55); max-width: 95vw; flex-wrap: wrap; justify-content: center;
  }
  #build-bar.show { display: flex; }
  .swatch-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid rgba(255,255,255,0.2);
    cursor: pointer; font-size: 0.68rem; font-weight: 800; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85); transition: transform 0.15s, border-color 0.15s;
  }
  .swatch-btn.active { border-color: #4ade80; transform: scale(1.1); box-shadow: 0 0 14px rgba(74, 222, 128, 0.5); }

  /* Avatar Customizer Modal */
  #avatar-modal {
    position: fixed; inset: 0; background: rgba(2, 6, 23, 0.78);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 16px;
  }
  #avatar-modal.show { display: flex; }
  .modal-box {
    background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 22px; padding: 22px; width: 360px; max-width: 94vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.65);
  }
  .modal-box h3 { font-size: 1.15rem; margin-bottom: 12px; color: #38bdf8; text-align: center; }
  .modal-box label { display: block; font-size: 0.8rem; color: #94a3b8; margin: 10px 0 6px; }
  .modal-box input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 1px solid rgba(148,163,184,0.25); background: #020617; color: #fff; font-size: 0.9rem;
  }
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .c-dot {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 2.5px solid transparent; transition: transform 0.15s;
  }
  .c-dot.active { border-color: #fff; transform: scale(1.12); box-shadow: 0 0 12px rgba(255,255,255,0.45); }
  .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
  .modal-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 12px;
    font-weight: 700; cursor: pointer; font-size: 0.88rem;
  }
  .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
  .btn-close { background: #334155; color: #e2e8f0; }

  /* Toast & Controls Hint */
  #toast {
    position: fixed; top: 115px; left: 50%; transform: translateX(-50%);
    background: rgba(16, 185, 129, 0.95); color: #fff; padding: 9px 20px;
    border-radius: 12px; font-weight: 700; font-size: 0.86rem;
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 40;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }
  #toast.show { opacity: 1; }

  .controls-hint {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(15, 23, 42, 0.72); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 10px 14px; font-size: 0.75rem; color: #cbd5e1;
    line-height: 1.65; pointer-events: none; z-index: 12;
  }

  /* Touch Controls */
  #joy-base {
    display: none; position: fixed; bottom: 26px; left: 26px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(125,211,252,0.4);
    z-index: 25; touch-action: none;
  }
  #joy-stick {
    position: absolute; top: 50%; left: 50%; width: 48px; height: 48px;
    border-radius: 50%; background: radial-gradient(circle, #38bdf8, #2563eb);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .touch-action {
    display: none; position: fixed; bottom: 34px; right: 28px;
    gap: 10px; flex-direction: column; z-index: 25;
  }
  .t-btn {
    width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
    font-weight: 800; font-size: 0.78rem; color: #fff; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  #t-jump { background: linear-gradient(135deg, #0284c7, #2563eb); }
  #t-build { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

  @media (pointer: coarse) {
    #joy-base, .touch-action { display: flex; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div class="hud-top">
  <div class="pill">
    <span id="hud-name">لاعب</span>
    <span class="stage">المرحلة: <strong id="hud-stage">1</strong></span>
    <span class="coins">عملات: <strong id="hud-coins">50</strong></span>
  </div>
  <div class="pill">
    <span class="pos" id="hud-pos">X: 0 | Y: 0 | Z: 0</span>
  </div>
</div>

<div class="toolbar">
  <button class="tool-btn" id="btn-build">وضع البناء (B)</button>
  <button class="tool-btn" id="btn-avatar">تخصيص الشخصية</button>
  <button class="tool-btn warn" id="btn-respawn">عودة للنقطة (R)</button>
  <button class="tool-btn" id="btn-reset-build">مسح بنائي</button>
</div>

<div id="build-bar"></div>

<div id="avatar-modal">
  <div class="modal-box">
    <h3>تخصيص الشخصية</h3>
    <label>اسم اللاعب</label>
    <input type="text" id="input-player-name" maxlength="18" placeholder="اكتب اسمك">
    <label>لون البدلة الأساسية</label>
    <div class="color-row" id="avatar-colors"></div>
    <div class="modal-actions">
      <button class="btn-save" id="btn-save-avatar">حفظ</button>
      <button class="btn-close" id="btn-close-avatar">إغلاق</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="controls-hint">
  <div><b>WASD / الأسهم:</b> الحركة • <b>Space:</b> قفز • <b>Shift:</b> ركض سريع</div>
  <div><b>سحب بالماوس (زر أيمن أو أوسط):</b> تدوير الكاميرا • <b>العجلة:</b> تقريب/إبعاد</div>
  <div><b>B:</b> وضع البناء • <b>كليك يسار:</b> وضع مكعب • <b>كليك يمين:</b> إزالة مكعبك</div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>
<div class="touch-action">
  <button class="t-btn" id="t-jump">قفز</button>
  <button class="t-btn" id="t-build">بناء</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function showToast(msg, bg = '#10b981') {
  const el = $('toast');
  el.textContent = msg;
  el.style.background = bg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2100);
}

// ═══════════════════════════════════════════════════════════
// SAVE & STATE
// ═══════════════════════════════════════════════════════════
const SAVE_KEY = 'bloxcraft_obby_save_v1';
const defaultSave = {
  name: 'مستكشف',
  color: 0x2563eb,
  coins: 50,
  stage: 1,
  checkpoint: { x: 0, y: 1.2, z: 0 },
  customBlocks: []
};

let state = (() => {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    return { ...defaultSave, ...(raw || {}), checkpoint: { ...defaultSave.checkpoint, ...(raw?.checkpoint || {}) } };
  } catch {
    return { ...defaultSave };
  }
})();

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}

function updateHUD() {
  $('hud-name').textContent = state.name;
  $('hud-stage').textContent = state.stage;
  $('hud-coins').textContent = state.coins;
}

// ═══════════════════════════════════════════════════════════
// SCENE, LIGHTING & SKY
// ═══════════════════════════════════════════════════════════
const canvas = $('game-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7dd3fc);
scene.fog = new THREE.FogExp2(0x93c5fd, 0.0055);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.95));
const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.8);
dirLight.position.set(35, 55, 30);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 5;
dirLight.shadow.camera.far = 180;
const d = 55;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
scene.add(dirLight);

// ═══════════════════════════════════════════════════════════
// BLOCKY PLAYER AVATAR (ROBLOX STYLE)
// ═══════════════════════════════════════════════════════════
let playerGroup, parts = {};

function buildAvatar(shirtHex) {
  if (playerGroup) scene.remove(playerGroup);
  playerGroup = new THREE.Group();

  const skinMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.5 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: shirtHex, roughness: 0.55 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
  const visorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.25, metalness: 0.4 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.05, 0.55), shirtMat);
  torso.position.y = 1.35;
  torso.castShadow = true;
  playerGroup.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.76, 0.76), skinMat);
  head.position.y = 2.28;
  head.castShadow = true;
  playerGroup.add(head);

  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.14, 0.05), visorMat);
  eyeL.position.set(-0.17, 2.32, 0.39);
  const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.14, 0.05), visorMat);
  eyeR.position.set(0.17, 2.32, 0.39);
  const smile = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.05), visorMat);
  smile.position.set(0, 2.12, 0.39);
  playerGroup.add(eyeL, eyeR, smile);

  const armGeo = new THREE.BoxGeometry(0.36, 0.95, 0.38);
  const armL = new THREE.Mesh(armGeo, shirtMat);
  armL.position.set(-0.72, 1.38, 0);
  armL.castShadow = true;
  const armR = new THREE.Mesh(armGeo, shirtMat);
  armR.position.set(0.72, 1.38, 0);
  armR.castShadow = true;
  playerGroup.add(armL, armR);

  const legGeo = new THREE.BoxGeometry(0.4, 0.85, 0.44);
  const legL = new THREE.Mesh(legGeo, pantsMat);
  legL.position.set(-0.24, 0.425, 0);
  legL.castShadow = true;
  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.position.set(0.24, 0.425, 0);
  legR.castShadow = true;
  playerGroup.add(legL, legR);

  parts = { torso, head, armL, armR, legL, legR };
  playerGroup.position.set(state.checkpoint.x, state.checkpoint.y, state.checkpoint.z);
  scene.add(playerGroup);
}

// ═══════════════════════════════════════════════════════════
// WORLD: SPAWN, OBBY STAGES, CHECKPOINTS, COINS & BUILD BLOCKS
// ═══════════════════════════════════════════════════════════
const solidMeshes = []; // { mesh, halfX, halfY, halfZ, moving }
const movingPlatforms = [];
const checkpoints = [];
const coinItems = [];
const customBlockMap = new Map();

function registerBox(x, y, z, w, h, d, color, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.65,
    metalness: opts.metalness ?? 0.08,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = !opts.noShadow;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const entry = {
    mesh,
    halfX: w / 2,
    halfY: h / 2,
    halfZ: d / 2,
    baseX: x,
    baseY: y,
    baseZ: z,
    moveAxis: opts.moveAxis || null,
    moveRange: opts.moveRange || 0,
    moveSpeed: opts.moveSpeed || 1.5,
    movePhase: opts.movePhase || 0
  };
  solidMeshes.push(entry);
  if (entry.moveAxis) movingPlatforms.push(entry);
  return entry;
}

function addCheckpoint(stageNum, x, y, z) {
  const pad = registerBox(x, y - 0.1, z, 5.2, 0.25, 5.2, 0x1e293b, { roughness: 0.4 });
  const beaconMat = new THREE.MeshStandardMaterial({
    color: state.stage >= stageNum ? 0x4ade80 : 0x38bdf8,
    emissive: state.stage >= stageNum ? 0x22c55e : 0x0284c7,
    emissiveIntensity: 0.65
  });
  const beacon = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.14, 3.6), beaconMat);
  beacon.position.set(x, y + 0.06, z);
  scene.add(beacon);

  checkpoints.push({ stage: stageNum, x, y: y + 0.2, z, beaconMat });
}

function addCoin(x, y, z, val = 10) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.45, 0.45, 0.16, 18),
    new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.45, metalness: 0.5, roughness: 0.25 })
  );
  mesh.rotation.x = Math.PI / 2;
  mesh.position.set(x, y, z);
  scene.add(mesh);
  coinItems.push({ mesh, baseY: y, val, phase: Math.random() * Math.PI * 2, collected: false });
}

function buildLevel() {
  // Main Lobby / Spawn Plaza
  registerBox(0, -0.5, 0, 26, 1, 26, 0x4ade80);
  registerBox(0, -0.45, 0, 10, 0.1, 10, 0xe2e8f0);

  // Decorative Pillars & Sandbox Area on the left
  registerBox(-18, -0.5, -6, 16, 1, 18, 0x86efac);
  addCoin(-18, 1.2, -6, 15);
  addCoin(-14, 1.2, -10, 15);

  // Obby Course leading forward (-Z)
  addCheckpoint(1, 0, 0, -9);

  // Stage 1 -> 2: Stepping blocks + moving platform
  registerBox(0, 0.6, -16, 4.5, 0.8, 4.5, 0x38bdf8);
  registerBox(2.5, 1.5, -22, 4.2, 0.8, 4.2, 0x38bdf8);
  addCoin(2.5, 2.7, -22, 10);
  registerBox(-2.2, 2.2, -28, 4.2, 0.8, 4.2, 0x38bdf8);
  registerBox(0, 2.6, -35, 5.5, 0.8, 4.5, 0xf59e0b, { moveAxis: 'x', moveRange: 4.5, moveSpeed: 1.6, movePhase: 0 });
  addCoin(0, 4.0, -35, 20);

  addCheckpoint(2, 0, 2.6, -44);

  // Stage 2 -> 3: Ascent & gaps
  registerBox(-3.5, 3.6, -51, 4.0, 0.8, 4.0, 0xa855f7);
  registerBox(3.5, 4.7, -57, 4.0, 0.8, 4.0, 0xa855f7);
  addCoin(3.5, 6.0, -57, 15);
  registerBox(0, 5.6, -64, 5.5, 0.8, 4.5, 0xf59e0b, { moveAxis: 'z', moveRange: 3.5, moveSpeed: 1.8, movePhase: 1.2 });
  registerBox(0, 6.4, -72, 6.0, 0.8, 5.0, 0xec4899);
  addCoin(0, 7.8, -72, 25);

  addCheckpoint(3, 0, 6.4, -80);

  // Stage 3 -> Summit Reward Platform
  registerBox(-3, 7.6, -87, 4.2, 0.8, 4.2, 0x10b981);
  registerBox(3, 8.8, -93, 4.2, 0.8, 4.2, 0x10b981);
  registerBox(0, 10.0, -101, 14, 1.2, 14, 0xfacc15, { emissive: 0x854d0e, emissiveIntensity: 0.25 });
  addCoin(-3, 11.6, -101, 30);
  addCoin(0, 11.8, -101, 50);
  addCoin(3, 11.6, -101, 30);

  // Restore saved custom blocks
  (state.customBlocks || []).forEach(b => {
    placeSavedBlock(b.x, b.y, b.z, b.color);
  });
}

// ═══════════════════════════════════════════════════════════
// BUILDING SYSTEM
// ═══════════════════════════════════════════════════════════
const BLOCK_SWATCHES = [
  { name: 'خشب', color: 0xb45309 },
  { name: 'حجر', color: 0x64748b },
  { name: 'أزرق', color: 0x0ea5e9 },
  { name: 'وردي', color: 0xec4899 },
  { name: 'أخضر', color: 0x22c55e },
  { name: 'ذهب', color: 0xfacc15 },
];
let buildMode = false;
let selectedColor = BLOCK_SWATCHES[0].color;

const ghostMesh = new THREE.Mesh(
  new THREE.BoxGeometry(2.02, 2.02, 2.02),
  new THREE.MeshBasicMaterial({ color: 0x4ade80, wireframe: true })
);
ghostMesh.visible = false;
scene.add(ghostMesh);

function setupBuildPalette() {
  const bar = $('build-bar');
  bar.innerHTML = '';
  BLOCK_SWATCHES.forEach((sw, idx) => {
    const btn = document.createElement('button');
    btn.className = 'swatch-btn' + (idx === 0 ? ' active' : '');
    btn.style.background = '#' + sw.color.toString(16).padStart(6, '0');
    btn.textContent = sw.name;
    btn.onclick = () => {
      selectedColor = sw.color;
      document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    bar.appendChild(btn);
  });
}

function placeSavedBlock(x, y, z, color) {
  const key = `${x},${y},${z}`;
  if (customBlockMap.has(key)) return;
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.customKey = key;
  scene.add(mesh);

  const boxEntry = { mesh, halfX: 1, halfY: 1, halfZ: 1, isCustom: true, key };
  solidMeshes.push(boxEntry);
  customBlockMap.set(key, { entry: boxEntry, data: { x, y, z, color } });
}

function toggleBuildMode(force) {
  buildMode = force !== undefined ? force : !buildMode;
  $('btn-build').classList.toggle('active', buildMode);
  $('build-bar').classList.toggle('show', buildMode);
  ghostMesh.visible = buildMode;
  showToast(buildMode ? 'وضع البناء مفعّل (كليك يسار للوضع، يمين للإزالة)' : 'تم إيقاف وضع البناء', buildMode ? '#2563eb' : '#475569');
}

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

function getBuildTargetPos() {
  raycaster.setFromCamera(pointerNDC, camera);
  const targets = solidMeshes.map(s => s.mesh);
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return null;
  const hit = hits[0];
  const n = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
  const p = hit.point.clone().addScaledVector(n, 1.0);
  const gx = Math.round(p.x / 2) * 2;
  const gy = Math.max(1, Math.round(p.y / 2) * 2);
  const gz = Math.round(p.z / 2) * 2;
  return { x: gx, y: gy, z: gz, hitObj: hit.object };
}

function updateBuildGhost() {
  if (!buildMode) { ghostMesh.visible = false; return; }
  const target = getBuildTargetPos();
  if (!target) { ghostMesh.visible = false; return; }
  ghostMesh.visible = true;
  ghostMesh.position.set(target.x, target.y, target.z);
}

function tryPlaceCustomBlock() {
  if (!buildMode) return;
  const target = getBuildTargetPos();
  if (!target) return;
  const key = `${target.x},${target.y},${target.z}`;
  if (customBlockMap.has(key)) return;
  const cost = 2;
  if (state.coins < cost) {
    showToast('تحتاج عملتين لوضع مكعب!', '#ef4444');
    return;
  }
  state.coins -= cost;
  placeSavedBlock(target.x, target.y, target.z, selectedColor);
  state.customBlocks.push({ x: target.x, y: target.y, z: target.z, color: selectedColor });
  persist();
  updateHUD();
}

function tryRemoveCustomBlock() {
  if (!buildMode) return;
  raycaster.setFromCamera(pointerNDC, camera);
  const customMeshes = Array.from(customBlockMap.values()).map(v => v.entry.mesh);
  const hits = raycaster.intersectObjects(customMeshes, false);
  if (!hits.length) return;
  const key = hits[0].object.userData.customKey;
  const item = customBlockMap.get(key);
  if (!item) return;
  scene.remove(item.entry.mesh);
  const idx = solidMeshes.indexOf(item.entry);
  if (idx !== -1) solidMeshes.splice(idx, 1);
  customBlockMap.delete(key);
  state.customBlocks = state.customBlocks.filter(b => `${b.x},${b.y},${b.z}` !== key);
  persist();
}

// ═══════════════════════════════════════════════════════════
// AVATAR MODAL
// ═══════════════════════════════════════════════════════════
const AVATAR_COLORS = [0x2563eb, 0xef4444, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x06b6d4, 0x334155];
let tempColor = state.color;

function setupAvatarModal() {
  const row = $('avatar-colors');
  row.innerHTML = '';
  AVATAR_COLORS.forEach(col => {
    const dot = document.createElement('div');
    dot.className = 'c-dot' + (col === tempColor ? ' active' : '');
    dot.style.background = '#' + col.toString(16).padStart(6, '0');
    dot.onclick = () => {
      tempColor = col;
      document.querySelectorAll('.c-dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
    };
    row.appendChild(dot);
  });

  $('btn-avatar').onclick = () => {
    tempColor = state.color;
    $('input-player-name').value = state.name;
    document.querySelectorAll('.c-dot').forEach((d, i) => d.classList.toggle('active', AVATAR_COLORS[i] === tempColor));
    $('avatar-modal').classList.add('show');
  };
  $('btn-close-avatar').onclick = () => $('avatar-modal').classList.remove('show');
  $('btn-save-avatar').onclick = () => {
    const pos = playerGroup.position.clone();
    const rot = playerGroup.rotation.y;
    state.name = ($('input-player-name').value || '').trim() || 'مستكشف';
    state.color = tempColor;
    persist();
    updateHUD();
    buildAvatar(state.color);
    playerGroup.position.copy(pos);
    playerGroup.rotation.y = rot;
    $('avatar-modal').classList.remove('show');
    showToast('تم تحديث شخصيتك!');
  };
}

// ═══════════════════════════════════════════════════════════
// CONTROLS (KEYBOARD, MOUSE CAMERA & TOUCH JOYSTICK)
// ═══════════════════════════════════════════════════════════
const keys = {};
let yaw = 0;
let pitch = 0.34;
let camDist = 9.5;
let isOrbiting = false;
let lastMX = 0, lastMY = 0;

let velY = 0;
let grounded = false;
let walkCycle = 0;
let joyX = 0, joyY = 0;

function respawnAtCheckpoint() {
  playerGroup.position.set(state.checkpoint.x, state.checkpoint.y + 0.5, state.checkpoint.z);
  velY = 0;
  grounded = false;
  showToast('عدت إلى نقطة الحفظ', '#38bdf8');
}

window.addEventListener('keydown', e => {
  if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  keys[e.code] = true;
  if (e.code === 'Space' && grounded) {
    velY = 12.2;
    grounded = false;
    e.preventDefault();
  }
  if (e.code === 'KeyB') toggleBuildMode();
  if (e.code === 'KeyR') respawnAtCheckpoint();
  if (e.code === 'Escape') {
    $('avatar-modal').classList.remove('show');
    if (buildMode) toggleBuildMode(false);
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousedown', e => {
  if ($('avatar-modal').classList.contains('show')) return;
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

  if (buildMode) {
    if (e.button === 0) tryPlaceCustomBlock();
    else if (e.button === 2) tryRemoveCustomBlock();
    return;
  }
  if (e.button === 2 || e.button === 1) {
    isOrbiting = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
    e.preventDefault();
  }
});

window.addEventListener('mouseup', () => { isOrbiting = false; });

window.addEventListener('mousemove', e => {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (isOrbiting) {
    const dx = e.clientX - lastMX;
    const dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    yaw -= dx * 0.0055;
    pitch = clamp(pitch + dy * 0.0045, -0.25, 1.15);
  }
});

window.addEventListener('wheel', e => {
  camDist = clamp(camDist + e.deltaY * 0.008, 4.5, 22);
}, { passive: true });

window.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Touch Joystick & Buttons
(() => {
  const base = $('joy-base');
  const stick = $('joy-stick');
  let dragging = false, cx = 0, cy = 0;

  base.addEventListener('touchstart', e => {
    e.preventDefault();
    const r = base.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    dragging = true;
  }, { passive: false });

  base.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    const t = e.touches[0];
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const maxR = 44;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyX = dx / maxR;
    joyY = dy / maxR;
  }, { passive: false });

  const endJoy = () => {
    dragging = false;
    joyX = 0;
    joyY = 0;
    stick.style.transform = 'translate(-50%, -50%)';
  };
  base.addEventListener('touchend', endJoy);
  base.addEventListener('touchcancel', endJoy);

  $('t-jump').onclick = () => {
    if (grounded) { velY = 12.2; grounded = false; }
  };
  $('t-build').onclick = () => toggleBuildMode();
})();

// Toolbar Buttons
$('btn-build').onclick = () => toggleBuildMode();
$('btn-respawn').onclick = respawnAtCheckpoint;
$('btn-reset-build').onclick = () => {
  customBlockMap.forEach(item => {
    scene.remove(item.entry.mesh);
    const idx = solidMeshes.indexOf(item.entry);
    if (idx !== -1) solidMeshes.splice(idx, 1);
  });
  customBlockMap.clear();
  state.customBlocks = [];
  persist();
  showToast('تم مسح مكعباتك المبنية', '#f59e0b');
};

// ═══════════════════════════════════════════════════════════
// PHYSICS, COLLISIONS & GAME LOOP
// ═══════════════════════════════════════════════════════════
const PLAYER_RADIUS = 0.45;
const PLAYER_HEIGHT = 2.65;

function collidesHorizontal(nx, py, nz) {
  for (const b of solidMeshes) {
    const m = b.mesh.position;
    const minY = m.y - b.halfY;
    const maxY = m.y + b.halfY;
    // Check overlap vertically with player body
    if (py + PLAYER_HEIGHT <= minY + 0.12 || py >= maxY - 0.12) continue;

    const closestX = clamp(nx, m.x - b.halfX, m.x + b.halfX);
    const closestZ = clamp(nz, m.z - b.halfZ, m.z + b.halfZ);
    const dx = nx - closestX;
    const dz = nz - closestZ;
    if (dx * dx + dz * dz < PLAYER_RADIUS * PLAYER_RADIUS) {
      return true;
    }
  }
  return false;
}

function findSupportY(px, py, pz, prevPy) {
  let support = -Infinity;
  let carrier = null;
  for (const b of solidMeshes) {
    const m = b.mesh.position;
    const withinX = Math.abs(px - m.x) <= b.halfX + PLAYER_RADIUS * 0.72;
    const withinZ = Math.abs(pz - m.z) <= b.halfZ + PLAYER_RADIUS * 0.72;
    if (!withinX || !withinZ) continue;
    const topY = m.y + b.halfY;
    if (prevPy >= topY - 0.35 && py <= topY + 0.08 && velY <= 0) {
      if (topY > support) {
        support = topY;
        carrier = b;
      }
    }
  }
  return { support, carrier };
}

let lastCarrier = null;
const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // Move platforms & carry standing player
  for (const mp of movingPlatforms) {
    const prevX = mp.mesh.position.x;
    const prevY = mp.mesh.position.y;
    const prevZ = mp.mesh.position.z;
    const offset = Math.sin(elapsed * mp.moveSpeed + mp.movePhase) * mp.moveRange;

    if (mp.moveAxis === 'x') mp.mesh.position.x = mp.baseX + offset;
    if (mp.moveAxis === 'y') mp.mesh.position.y = mp.baseY + offset;
    if (mp.moveAxis === 'z') mp.mesh.position.z = mp.baseZ + offset;

    if (grounded && lastCarrier === mp) {
      playerGroup.position.x += mp.mesh.position.x - prevX;
      playerGroup.position.y += mp.mesh.position.y - prevY;
      playerGroup.position.z += mp.mesh.position.z - prevZ;
    }
  }

  // Movement input
  let moveX = 0;
  let moveZ = 0;
  if (keys.KeyW || keys.ArrowUp) moveZ -= 1;
  if (keys.KeyS || keys.ArrowDown) moveZ += 1;
  if (keys.KeyA || keys.ArrowLeft) moveX -= 1;
  if (keys.KeyD || keys.ArrowRight) moveX += 1;
  moveX += joyX;
  moveZ += joyY;

  const mag = Math.hypot(moveX, moveZ);
  const isMoving = mag > 0.1;
  const sprinting = (keys.ShiftLeft || keys.ShiftRight) && isMoving;
  const speed = sprinting ? 13.5 : 8.2;

  if (isMoving) {
    moveX /= mag;
    moveZ /= mag;
    const fwdX = -Math.sin(yaw);
    const fwdZ = -Math.cos(yaw);
    const rightX = Math.cos(yaw);
    const rightZ = -Math.sin(yaw);

    const worldDX = -moveZ * fwdX + moveX * rightX;
    const worldDZ = -moveZ * fwdZ + moveX * rightZ;

    const nextX = playerGroup.position.x + worldDX * speed * dt;
    const nextZ = playerGroup.position.z + worldDZ * speed * dt;

    if (!collidesHorizontal(nextX, playerGroup.position.y, playerGroup.position.z)) {
      playerGroup.position.x = nextX;
    }
    if (!collidesHorizontal(playerGroup.position.x, playerGroup.position.y, nextZ)) {
      playerGroup.position.z = nextZ;
    }

    const targetAngle = Math.atan2(worldDX, worldDZ);
    let diff = targetAngle - playerGroup.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    playerGroup.rotation.y += diff * Math.min(1, dt * 14);
  }

  // Gravity & Ground Support
  const prevY = playerGroup.position.y;
  velY -= 28 * dt;
  playerGroup.position.y += velY * dt;

  const { support, carrier } = findSupportY(
    playerGroup.position.x,
    playerGroup.position.y,
    playerGroup.position.z,
    prevY
  );

  if (support !== -Infinity) {
    playerGroup.position.y = support;
    velY = 0;
    grounded = true;
    lastCarrier = carrier;
  } else {
    grounded = false;
    lastCarrier = null;
  }

  // Respawn if fell below world
  if (playerGroup.position.y < -18) {
    respawnAtCheckpoint();
  }

  // Checkpoints
  for (const cp of checkpoints) {
    const dXZ = Math.hypot(playerGroup.position.x - cp.x, playerGroup.position.z - cp.z);
    const dY = Math.abs(playerGroup.position.y - cp.y);
    if (dXZ < 2.6 && dY < 2.0 && state.stage < cp.stage) {
      state.stage = cp.stage;
      state.checkpoint = { x: cp.x, y: cp.y + 0.3, z: cp.z };
      state.coins += 25;
      cp.beaconMat.color.setHex(0x4ade80);
      cp.beaconMat.emissive.setHex(0x22c55e);
      persist();
      updateHUD();
      showToast(`وصلت للمرحلة ${cp.stage}! +25 عملة`, '#0284c7');
    }
  }

  // Coins pickup & spin
  for (const c of coinItems) {
    if (c.collected) continue;
    c.mesh.rotation.z += dt * 3.2;
    c.mesh.position.y = c.baseY + Math.sin(elapsed * 3.5 + c.phase) * 0.22;
    if (playerGroup.position.distanceTo(c.mesh.position) < 1.85) {
      c.collected = true;
      c.mesh.visible = false;
      state.coins += c.val;
      persist();
      updateHUD();
      showToast(`+${c.val} عملة`, '#eab308');
    }
  }

  // Limb animation
  if (isMoving && grounded) {
    walkCycle += dt * (sprinting ? 16 : 11);
    const swing = Math.sin(walkCycle) * 0.72;
    parts.legL.rotation.x = swing;
    parts.legR.rotation.x = -swing;
    parts.armL.rotation.x = -swing * 0.85;
    parts.armR.rotation.x = swing * 0.85;
  } else {
    parts.legL.rotation.x *= 0.8;
    parts.legR.rotation.x *= 0.8;
    parts.armL.rotation.x *= 0.8;
    parts.armR.rotation.x *= 0.8;
  }

  // Camera follow
  const focus = new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1.85, playerGroup.position.z);
  const horizDist = Math.cos(pitch) * camDist;
  const vertDist = Math.sin(pitch) * camDist;
  const desiredCam = new THREE.Vector3(
    focus.x + Math.sin(yaw) * horizDist,
    focus.y + vertDist,
    focus.z + Math.cos(yaw) * horizDist
  );
  camera.position.lerp(desiredCam, Math.min(1, dt * 12));
  camera.lookAt(focus);

  updateBuildGhost();

  $('hud-pos').textContent = `X: ${playerGroup.position.x.toFixed(1)} | Y: ${playerGroup.position.y.toFixed(1)} | Z: ${playerGroup.position.z.toFixed(1)}`;
  renderer.render(scene, camera);
}

setupBuildPalette();
setupAvatarModal();
buildLevel();
buildAvatar(state.color);
updateHUD();
loop();
</script>
</body>
</html>

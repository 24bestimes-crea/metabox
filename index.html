const Audio = {
  ctx: null, init() { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.ctx.resume(); },
  playTone(f, d=0.1, t='sine', v=0.2) { if(!this.ctx) return; const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d); },
  sfx(n) { if(!this.ctx) return; if(n==='jump') this.playTone(440); if(n==='coin'){this.playTone(880); setTimeout(()=>this.playTone(1320),60);} if(n==='hit') this.playTone(120,0.1,'square'); if(n==='build') this.playTone(330,0.1,'square'); if(n==='levelup') [523,659,784].forEach((f,i)=>setTimeout(()=>this.playTone(f,0.2),i*100)); }
};

// ═══════════════════════════════════════════════════════════
// 2. GAME STATE & CONSTANTS
// ═══════════════════════════════════════════════════════════
const Game = {
  user: null, profile: null, scene: null, camera: null, renderer: null, clock: new THREE.Clock(),
  player: null, avatar: { parts: {} }, keys: {}, yaw: 0, pitch: 0.25, isSprinting: false,
  velocityY: 0, isGrounded: true, animals: [], collidables: [], enemies: [], platforms: [], trees: [], rocks: [], particles: [], portals: [], coins: [], nests: [], thieves: [],
  isMobile: /Android|iPhone|iPad/i.test(navigator.userAgent), currentWorld: 'main', joystickX: 0, joystickY: 0, nearbyAnimal: null,
  resources: { wood: 0, stone: 0, food: 0 },
  raycaster: new THREE.Raycaster(), mouse: new THREE.Vector2(), lastAttack: 0, attackAnimTime: 0,
  houseBuildProgress: { stage: null }, playerHouse: null, towerFloor: 0,
  physics: { velocity: new THREE.Vector3(), grounded: false, gravity: -28, jumpForce: 9 }
};

const WORLDS = {
  main: { name:'العالم الرئيسي', emoji:'🌳', fog:0x87CEEB, ground:0x3a7d44, sky:0x87CEEB, minLevel:1 },
  stoneage: { name:'العصر الحجري', emoji:'🪨', fog:0x8b7d6b, ground:0x6b5b4a, sky:0xa8c3d4, minLevel:1 },
  action: { name:'الأكشن', emoji:'⚔️', fog:0x333333, ground:0x444444, sky:0x222222, minLevel:2 },
  horror: { name:'المرعب', emoji:'👻', fog:0x220000, ground:0x1a0a0a, sky:0x110000, minLevel:3 },
  ice: { name:'الجليد', emoji:'❄️', fog:0xccddff, ground:0xaaccee, sky:0xddeeff, minLevel:5 },
  void: { name:'الفراغ', emoji:'🌌', fog:0x000000, ground:0x111111, sky:0x000000, minLevel:10 }
};

const CREATURE_TYPES = {
  rabbit: { name:'أرنب', level:1, color:0xeeeedd, scale:0.6, speed:4, bodyParts:'rabbit' },
  wolf: { name:'ذئب', level:5, color:0x666666, scale:1.2, speed:7, bodyParts:'wolf' },
  trex: { name:'تي-ريكس', level:25, color:0x4a6b3a, scale:2.5, speed:6, bodyParts:'dragon' },
  spiritFox: { name:'ثعلب روحي', level:12, color:0x00ffff, scale:1.0, speed:8, bodyParts:'wolf' }
};

// ═══════════════════════════════════════════════════════════
// 3. PLAYER BUILDING & PHYSICS
// ═══════════════════════════════════════════════════════════
function terrainHeight(x, z) { return Math.sin(x * 0.05) * 2 + Math.cos(z * 0.07) * 1.5 + Math.sin((x + z) * 0.03) * 3; }

function buildPlayer() {
  if (Game.player) Game.scene.remove(Game.player);
  const g = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0a9 });
  const clothMat = new THREE.MeshStandardMaterial({ color: 0x2d4a4a });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x666666 });

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), clothMat); torso.position.y = 1.55; g.add(torso); Game.avatar.parts.torso = torso;
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 20), skinMat); head.position.y = 2.6; g.add(head); Game.avatar.parts.head = head;
  // Hair
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 16, 0, Math.PI*2, 0, Math.PI*0.55), new THREE.MeshStandardMaterial({ color: 0x5a3a1a })); hair.position.y = 2.68; g.add(hair);
  // Arms
  const armGeo = new THREE.BoxGeometry(0.22, 0.9, 0.22);
  const armL = new THREE.Mesh(armGeo, clothMat); armL.position.set(-0.6, 1.5, 0); g.add(armL); Game.avatar.parts.armL = armL;
  const armR = new THREE.Mesh(armGeo, clothMat); armR.position.set(0.6, 1.5, 0); g.add(armR); Game.avatar.parts.armR = armR;
  // Legs
  const legGeo = new THREE.BoxGeometry(0.28, 0.9, 0.28);
  const legL = new THREE.Mesh(legGeo, pantsMat); legL.position.set(-0.22, 0.55, 0); g.add(legL); Game.avatar.parts.legL = legL;
  const legR = new THREE.Mesh(legGeo, pantsMat); legR.position.set(0.22, 0.55, 0); g.add(legR); Game.avatar.parts.legR = legR;

  g.position.set(0, terrainHeight(0,0)+1, 0);
  Game.scene.add(g);
  Game.player = g;
}

function updatePhysics(dt) {
  if (!Game.player) return;
  const p = Game.player.position, phys = Game.physics;
  p.x = clamp(p.x, -140, 140); p.z = clamp(p.z, -140, 140);
  
  phys.velocity.y += phys.gravity * dt; p.y += phys.velocity.y * dt;
  const groundY = terrainHeight(p.x, p.z);
  
  if (p.y <= groundY) {
    p.y = groundY; phys.velocity.y = 0; phys.grounded = true;
  } else phys.grounded = false;

  for (const c of Game.collidables) {
    const dx = p.x - c.position.x, dz = p.z - c.position.z, r = (c.userData.radius||1) + 0.4;
    const d = Math.hypot(dx, dz);
    if (d < r && d > 0.01) { p.x += (dx/d)*(r-d); p.z += (dz/d)*(r-d); }
  }
}

// ═══════════════════════════════════════════════════════════
// 4. WORLD BUILDING
// ═══════════════════════════════════════════════════════════
function buildTerrain(worldId) {
  const w = WORLDS[worldId]; Game.platforms = [];
  const geo = new THREE.PlaneGeometry(300, 300, 60, 60);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, terrainHeight(pos.getX(i), pos.getY(i)));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: w.ground, flatShading: true }));
  ground.rotation.x = -Math.PI/2; Game.scene.add(ground);

  // Trees
  for (let i = 0; i < 30; i++) {
    const x = rand(-80,80), z = rand(-80,80);
    if (Math.hypot(x,z) < 10) continue;
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,3,8), new THREE.MeshStandardMaterial({ color: 0x5a3a1a }));
    tr.position.set(x, terrainHeight(x,z)+1.5, z); Game.scene.add(tr);
    const lv = new THREE.Mesh(new THREE.ConeGeometry(2,3,8), new THREE.MeshStandardMaterial({ color: 0x2d7d3a, flatShading: true }));
    lv.position.set(x, terrainHeight(x,z)+4, z); Game.scene.add(lv);
    Game.collidables.push({ position: tr.position, userData: { radius: 0.6 } });
  }
}

// ═══════════════════════════════════════════════════════════
// 5. ANIMALS AI
// ═══════════════════════════════════════════════════════════
function spawnCreature(typeId, x, z) {
  const t = CREATURE_TYPES[typeId]; if(!t) return;
  const g = new THREE.Group();
  if (t.bodyParts === 'rabbit') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.4,12,12), new THREE.MeshStandardMaterial({ color: t.color })); body.position.y=0.5; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12), new THREE.MeshStandardMaterial({ color: t.color })); head.position.set(0,0.85,0.5); g.add(head);
  } else {
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1,6,12), new THREE.MeshStandardMaterial({ color: t.color })); body.rotation.z=Math.PI/2; body.position.y=0.8; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,12), new THREE.MeshStandardMaterial({ color: t.color })); head.position.set(0,1,0.75); g.add(head);
  }
  g.scale.setScalar(t.scale); g.position.set(x, terrainHeight(x,z), z);
  g.userData = { typeId, state: 'idle', timer: rand(1,3), speed: t.speed, target: null };
  Game.scene.add(g); Game.animals.push(g);
}

function updateAnimals(dt) {
  for (const a of Game.animals) {
    a.userData.timer -= dt;
    if (a.userData.timer <= 0) {
      a.userData.state = Math.random() < 0.5 ? 'wander' : 'idle';
      a.userData.timer = rand(2,5);
      a.userData.target = new THREE.Vector3(a.position.x + rand(-10,10), 0, a.position.z + rand(-10,10));
    }
    if (a.userData.state === 'wander' && a.userData.target) {
      const dir = a.userData.target.clone().sub(a.position).setY(0).normalize();
      a.position.addScaledVector(dir, a.userData.speed * dt);
      a.rotation.y = Math.atan2(dir.x, dir.z);
    }
    a.position.y = terrainHeight(a.position.x, a.position.z);
  }
}

// ═══════════════════════════════════════════════════════════
// 6. ADVANCED SYSTEMS (The Forest, Building, Nests)
// ═══════════════════════════════════════════════════════════
const BUILD_STAGES = {
  foundation: { name: 'الأساس', wood: 10, stone: 5 },
  walls: { name: 'الجدران', wood: 20, stone: 10 },
  roof: { name: 'السقف', wood: 15, stone: 0 }
};

function startBuilding() {
  if (Game.playerHouse) { toast('لديك بيت بالفعل!'); return; }
  Game.houseBuildProgress.stage = 'foundation';
  updateBuildHUD();
}

function updateBuildHUD() {
  const hud = $('build-progress-hud');
  if (!hud) return;
  if (!Game.houseBuildProgress.stage) { hud.style.display = 'none'; return; }
  hud.style.display = 'block';
  const stage = BUILD_STAGES[Game.houseBuildProgress.stage];
  hud.innerHTML = `<div style="color:#00d2ff;margin-bottom:5px;">🏗️ ${stage.name}</div>
    <div>🪵 ${Game.resources.wood}/${stage.wood} | ⬛ ${Game.resources.stone}/${stage.stone}</div>
    <button id="btn-do-build" style="margin-top:5px;width:100%;padding:5px;background:#2ecc71;border:none;border-radius:5px;cursor:pointer;">بناء</button>`;
  $('btn-do-build').onclick = () => {
    if (Game.resources.wood >= stage.wood && Game.resources.stone >= stage.stone) {
      Game.resources.wood -= stage.wood; Game.resources.stone -= stage.stone;
      if (stage.name === 'الأساس') {
        Game.playerHouse = new THREE.Group();
        const floor = new THREE.Mesh(new THREE.BoxGeometry(6,0.2,6), new THREE.MeshStandardMaterial({ color: 0x8b6f47 }));
        Game.playerHouse.add(floor);
        Game.playerHouse.position.copy(Game.player.position);
        Game.scene.add(Game.playerHouse);
      } else if (stage.name === 'الجدران') {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(6,3,0.2), new THREE.MeshStandardMaterial({ color: 0xa0522d }));
        wall.position.set(0,1.5,-3); Game.playerHouse.add(wall);
      } else if (stage.name === 'السقف') {
        const roof = new THREE.Mesh(new THREE.ConeGeometry(4,2,4), new THREE.MeshStandardMaterial({ color: 0xa02a2a }));
        roof.position.y = 4; Game.playerHouse.add(roof);
        toast('🏠 اكتمل البيت!'); Game.houseBuildProgress.stage = null; updateBuildHUD(); return;
      }
      Game.houseBuildProgress.stage = stage.name === 'الأساس' ? 'walls' : 'roof';
      updateBuildHUD();
    } else toast('موارد غير كافية', '#ff4757');
  };
}

function createNest(x, z, type) {
  const nest = new THREE.Group();
  const egg = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshStandardMaterial({ color: 0xffeecc }));
  egg.position.y = 0.2; nest.add(egg); nest.position.set(x, terrainHeight(x,z), z);
  nest.userData = { isNest: true, type, stolen: false, egg };
  Game.scene.add(nest); Game.nests.push(nest);
}
// ═══════════════════════════════════════════════════════════
// 7. INPUT & CONTROLS
// ═══════════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  Game.keys[e.code] = true;
  if (e.code === 'Space') jump();
  if (e.code === 'KeyF') attack();
  if (e.code === 'KeyE') { // Action (Chop/Steal)
    if (Game.nearbyAnimal) tryTame();
    else if (Game.playerHouse) startBuilding();
    else toast('اقترب من شيء للتفاعل');
  }
  if (e.code === 'KeyB') startBuilding();
});
window.addEventListener('keyup', e => Game.keys[e.code] = false);

function setupMobileControls() {
  if (!Game.isMobile) return;
  const zone = $('joystick-zone'), knob = $('joystick-knob');
  if (!zone) return;
  let touchId = null;
  zone.addEventListener('touchstart', e => { touchId = e.changedTouches[0].identifier; e.preventDefault(); }, {passive:false});
  zone.addEventListener('touchmove', e => {
    for(let t of e.changedTouches) {
      if(t.identifier === touchId) {
        const rect = zone.getBoundingClientRect(), cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
        let dx = t.clientX-cx, dy = t.clientY-cy, max = rect.width/2-20, d = Math.hypot(dx,dy);
        if(d>max) { dx=(dx/d)*max; dy=(dy/d)*max; }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        Game.joystickX = dx/max; Game.joystickY = dy/max;
      }
    }
  });
  zone.addEventListener('touchend', () => { touchId=null; Game.joystickX=0; Game.joystickY=0; knob.style.transform='translate(-50%,-50%)'; });
  $('jump-btn').ontouchstart = (e) => { jump(); e.preventDefault(); };
  $('attack-btn').ontouchstart = (e) => { attack(); e.preventDefault(); };
  $('build-btn').ontouchstart = (e) => { startBuilding(); e.preventDefault(); };
}

function jump() {
  if (Game.physics.grounded) { Game.physics.velocity.y = Game.physics.jumpForce; Audio.sfx('jump'); }
}

function attack() {
  if (Date.now() - Game.lastAttack < 500) return;
  Game.lastAttack = Date.now(); Game.attackAnimTime = 0.3;
  Audio.sfx('hit');
  // Simple hit logic
  for (let e of Game.enemies) {
    if (e.position.distanceTo(Game.player.position) < 3) {
      toast('💥 ضربة!'); spawnParticles(e.position, 0xff0000, 5);
    }
  }
}

function tryTame() {
  if(!Game.nearbyAnimal) return;
  toast(`🐾 تم ترويض ${CREATURE_TYPES[Game.nearbyAnimal.userData.typeId].name}!`);
  Game.nearbyAnimal.userData.state = 'follow';
  Game.nearbyAnimal = null;
  $('animal-card').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// 8. PARTICLES & VISUALS
// ═══════════════════════════════════════════════════════════
function spawnParticles(pos, color, count) {
  for(let i=0; i<count; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos); p.userData = { vel: new THREE.Vector3(rand(-2,2), rand(1,3), rand(-2,2)), life: 1 };
    Game.scene.add(p); Game.particles.push(p);
  }
}
function updateParticles(dt) {
  for(let i=Game.particles.length-1; i>=0; i--) {
    const p = Game.particles[i]; p.position.addScaledVector(p.userData.vel, dt); p.userData.vel.y -= 10*dt; p.userData.life -= dt*2;
    if(p.userData.life <= 0) { Game.scene.remove(p); Game.particles.splice(i,1); }
  }
}

// ═══════════════════════════════════════════════════════════
// 9. MAIN LOOP & INIT
// ═══════════════════════════════════════════════════════════
function animate() {
  if (!Game.renderer) return;
  requestAnimationFrame(animate);
  const dt = Math.min(Game.clock.getDelta(), 0.05);

  updatePhysics(dt);
  
  if (Game.player) {
    // Movement
    let ix = 0, iz = 0;
    if (Game.keys['KeyW']) iz -= 1; if (Game.keys['KeyS']) iz += 1;
    if (Game.keys['KeyA']) ix -= 1; if (Game.keys['KeyD']) ix += 1;
    if (Game.isMobile) { ix = Game.joystickX; iz = Game.joystickY; }
    const speed = (Game.keys['ShiftLeft'] ? 10 : 5) * dt;
    Game.player.position.x += ix * speed; Game.player.position.z += iz * speed;
    if (ix!==0 || iz!==0) Game.player.rotation.y = Math.atan2(ix, iz);

    // Camera follow
    const target = Game.player.position.clone().add(new THREE.Vector3(0, 2, 0));
    Game.camera.position.lerp(target.clone().add(new THREE.Vector3(0, 5, 10)), 0.1);
    Game.camera.lookAt(target);

    // Animal detection
    let near = null; let minD = 4;
    for (let a of Game.animals) {
      const d = a.position.distanceTo(Game.player.position);
      if (d < minD) { minD = d; near = a; }
    }
    if (near !== Game.nearbyAnimal) {
      Game.nearbyAnimal = near;
      if (near) {
        $('animal-card').style.display = 'block';
        $('ac-name').textContent = CREATURE_TYPES[near.userData.typeId].name;
        $('ac-level').textContent = 'مستوى ' + CREATURE_TYPES[near.userData.typeId].level;
      } else $('animal-card').style.display = 'none';
    }
  }

  updateAnimals(dt);
  updateParticles(dt);
  Game.renderer.render(Game.scene, Game.camera);
}

function initWorld(worldId) {
  const w = WORLDS[worldId];
  const s = new THREE.Scene(); s.background = new THREE.Color(w.sky); s.fog = new THREE.Fog(w.fog, 60, 180); Game.scene = s;
  Game.camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 800);
  Game.renderer = new THREE.WebGLRenderer({ antialias: !Game.isMobile });
  Game.renderer.setSize(innerWidth, innerHeight);
  $('canvas-container').innerHTML = ''; $('canvas-container').appendChild(Game.renderer.domElement);

  s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(50, 80, 50); s.add(sun);

  Game.animals = []; Game.collidables = []; Game.enemies = []; Game.particles = []; Game.nests = [];
  buildTerrain(worldId);
  
  // Spawns
  spawnCreature('rabbit', 5, 5);
  spawnCreature('wolf', -10, -10);
  if (worldId === 'stoneage') { spawnCreature('trex', 20, 20); createNest(-5, 15, 'trex'); }
  if (worldId === 'main') { createNest(10, -10, 'rabbit'); }

  buildPlayer();
  setupMobileControls();

  $('loading').style.display = 'none';
  $('world-badge').textContent = `${w.emoji} ${w.name}`;
  Game.clock = new THREE.Clock();
  animate();
}

// ═══════════════════════════════════════════════════════════
// 10. UI LOGIC & AUTH
// ═══════════════════════════════════════════════════════════
$('btn-guest').onclick = () => {
  Audio.init();
  Game.profile = { level: 1, coins: 100, gems: 0, hp: 100, energy: 100 };
  $('login-screen').style.display = 'none';
  $('world-select').classList.add('active');
  renderWorlds();
};

function renderWorlds() {
  const grid = $('worlds-grid'); grid.innerHTML = '';
  Object.entries(WORLDS).forEach(([id, w]) => {
    const lock = Game.profile.level < w.minLevel;
    const c = document.createElement('div');
    c.className = 'world-card' + (lock ? ' locked' : '');
    c.innerHTML = `<div class="icon">${w.emoji}</div><h3>${w.name}</h3><div class="stats"><span>مستوى ${w.minLevel}</span></div>`;
    if(!lock) c.onclick = () => enterWorld(id); else c.onclick = () => toast('مستوى غير كافٍ', '#ff4757');
    grid.appendChild(c);
  });
}

function enterWorld(id) {
  Game.currentWorld = id;
  $('world-select').classList.remove('active');
  $('world-screen').style.display = 'block';
  initWorld(id);
}

// UI Buttons
$('btn-profile').onclick = () => $('profile-panel').classList.add('active');
$('btn-shop').onclick = () => $('shop-panel').classList.add('active');
$('btn-customize').onclick = () => $('customization-panel').classList.add('active');
$('btn-logout').onclick = () => location.reload();

// Init
window.addEventListener('resize', () => {
  if (Game.camera && Game.renderer) {
    Game.camera.aspect = innerWidth/innerHeight;
    Game.camera.updateProjectionMatrix();
    Game.renderer.setSize(innerWidth, innerHeight);
  }
});
</script>

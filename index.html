<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlix + Firebase — أفلام، مسلسلات، وأنمي</title>
  <style>
    :root {
      --bg: #141414;
      --bg-elev: #1f1f1f;
      --bg-card: #242424;
      --text: #ffffff;
      --muted: #b3b3b3;
      --red: #e50914;
      --accent: #38bdf8;
      --green: #10b981;
      --radius: 7px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 4%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0));
      transition: background-color 0.25s ease;
      flex-wrap: wrap;
    }

    header.scrolled {
      background: rgba(20, 20, 20, 0.97);
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--red);
      text-decoration: none;
    }

    .nav-tabs, .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active { background: var(--red); border-color: var(--red); }

    .controls input,
    .controls select,
    .modal select,
    .modal input,
    .modal textarea {
      background: #121212;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius);
      padding: 7px 11px;
      font-size: 0.86rem;
      outline: none;
      font-family: inherit;
    }

    .status-bar {
      margin-top: 66px;
      padding: 8px 4%;
      background: #1b1b1b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .hero {
      position: relative;
      min-height: 62vh;
      display: flex;
      align-items: flex-end;
      padding: 40px 4% 52px;
      background-size: cover;
      background-position: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, var(--bg) 6%, rgba(20,20,20,0.35) 55%, rgba(20,20,20,0.65) 100%),
        linear-gradient(to left, rgba(20,20,20,0.85) 0%, rgba(20,20,20,0.15) 65%);
    }

    .hero-content { position: relative; z-index: 2; max-width: 600px; }

    .hero-badge {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .hero h1 { font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.15; margin-bottom: 12px; }
    .hero p { color: #e5e5e5; font-size: 0.96rem; line-height: 1.6; margin-bottom: 18px; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play { background: #fff; color: #000; }
    .btn-secondary { background: rgba(109, 109, 110, 0.72); color: #fff; }
    .btn-accent { background: var(--accent); color: #07131d; }
    .btn-green { background: var(--green); color: #052e16; }
    .btn-red { background: var(--red); color: #fff; }

    main { padding: 14px 4% 64px; }
    .section { margin-bottom: 32px; }
    .section-title { font-size: 1.18rem; font-weight: 800; margin-bottom: 14px; }

    .row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-elev);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 26px rgba(0,0,0,0.65); }
    .card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
    .card-body { padding: 10px 12px 12px; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }

    .type-pill {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.7rem;
    }

    .empty-msg { color: var(--muted); font-size: 0.92rem; padding: 10px 0; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 900px;
      max-height: 92vh;
      overflow-y: auto;
      background: #181818;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .close-btn { background: transparent; color: #fff; border: none; font-size: 1.4rem; cursor: pointer; }
    video { width: 100%; max-height: 55vh; background: #000; display: block; }

    /* Auto-Next Episode Bar */
    .next-ep-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: #232323;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .next-ep-banner.show { display: flex; }
    .next-ep-text { font-size: 0.9rem; line-height: 1.4; }
    .next-ep-text strong { color: #fff; }
    .next-ep-text span { color: var(--accent); font-weight: 800; }

    .modal-info { padding: 16px 18px 22px; }
    .modal-info h3 { margin-bottom: 6px; font-size: 1.2rem; }
    .modal-info p { color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin-bottom: 14px; }

    .episodes-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
    .episodes-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .episodes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

    .ep-card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
    }

    .ep-card.active { border-color: var(--red); background: rgba(229, 9, 20, 0.14); }
    .ep-card strong { display: block; font-size: 0.88rem; margin-bottom: 3px; }
    .ep-card span { font-size: 0.76rem; color: var(--muted); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .form-field label { font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <header id="navbar">
    <a href="#" class="brand">STREAMFLIX</a>

    <nav class="nav-tabs" aria-label="الأقسام">
      <button class="tab-btn active" data-type="all">الكل</button>
      <button class="tab-btn" data-type="movie">أفلام</button>
      <button class="tab-btn" data-type="series">مسلسلات</button>
      <button class="tab-btn" data-type="anime">أنمي</button>
      <button class="tab-btn" data-type="mylist">قائمتي</button>
    </nav>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="ابحث..." />
      <select id="genreSelect" aria-label="التصنيف">
        <option value="all">كل التصنيفات</option>
        <option value="خيال علمي">خيال علمي</option>
        <option value="مغامرة">مغامرة</option>
        <option value="أنمي">أنمي</option>
        <option value="أكشن">أكشن</option>
      </select>
      <button class="btn btn-accent" id="openAddModalBtn">+ إضافة لقاعدة البيانات</button>
    </div>
  </header>

  <div class="status-bar">
    <span id="dbStatus">حالة Firebase: جاري الاتصال بمشروع metaverse-metabox...</span>
    <button class="btn btn-secondary" id="seedDataBtn" style="padding:5px 12px;font-size:0.78rem;">
      تعبئة بيانات تجريبية في Firestore
    </button>
  </div>

  <section class="hero" id="hero">
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">مميز اليوم</span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="btn-row">
        <button class="btn btn-play" id="heroPlayBtn">▶ تشغيل الآن</button>
        <button class="btn btn-secondary" id="heroListBtn">+ قائمتي</button>
      </div>
    </div>
  </section>

  <main>
    <section class="section" id="myListSection">
      <h2 class="section-title">قائمتي</h2>
      <div class="row-grid" id="myListGrid"></div>
    </section>

    <section class="section">
      <h2 class="section-title" id="mainSectionTitle">المحتوى المتاح</h2>
      <div class="row-grid" id="catalogGrid"></div>
    </section>
  </main>

  <!-- Player Modal -->
  <div class="modal-backdrop" id="playerModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-top">
        <strong id="modalTitle">المشغّل</strong>
        <button class="close-btn" id="closePlayerBtn" aria-label="إغلاق">✕</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>

      <!-- Auto Next Episode Countdown Banner -->
      <div class="next-ep-banner" id="nextEpBanner">
        <div class="next-ep-text">
          الحلقة التالية: <strong id="nextEpName"></strong> — سيتم التشغيل خلال <span id="nextEpCountdown">5</span> ثوانٍ
        </div>
        <div class="btn-row">
          <button class="btn btn-red" id="playNextNowBtn">▶ تشغيل الآن</button>
          <button class="btn btn-secondary" id="cancelAutoNextBtn">إلغاء</button>
        </div>
      </div>

      <div class="modal-info">
        <h3 id="infoTitle"></h3>
        <p id="infoDesc"></p>
        <button class="btn btn-secondary" id="modalToggleListBtn"></button>

        <div class="episodes-box" id="episodesBox" style="display:none;">
          <div class="episodes-head">
            <strong>المواسم والحلقات</strong>
            <select id="seasonSelect" aria-label="اختر الموسم"></select>
          </div>
          <div class="episodes-list" id="episodesList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Item to Firestore Modal -->
  <div class="modal-backdrop" id="addModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-top">
        <strong>إضافة فيلم / مسلسل / أنمي إلى Firestore</strong>
        <button class="close-btn" id="closeAddBtn" aria-label="إغلاق">✕</button>
      </div>
      <form class="modal-info" id="addItemForm">
        <div class="form-grid">
          <div class="form-field">
            <label>النوع</label>
            <select id="newType">
              <option value="movie">فيلم (movie)</option>
              <option value="series">مسلسل (series)</option>
              <option value="anime">أنمي (anime)</option>
            </select>
          </div>
          <div class="form-field">
            <label>التصنيف</label>
            <select id="newGenre">
              <option value="خيال علمي">خيال علمي</option>
              <option value="مغامرة">مغامرة</option>
              <option value="أنمي">أنمي</option>
              <option value="أكشن">أكشن</option>
            </select>
          </div>
          <div class="form-field">
            <label>سنة الإنتاج</label>
            <input type="text" id="newYear" value="2026" required />
          </div>
        </div>

        <div class="form-field">
          <label>العنوان</label>
          <input type="text" id="newTitle" placeholder="مثال: مغامرة الفضاء" required />
        </div>

        <div class="form-field">
          <label>رابط صورة الغلاف (Poster URL)</label>
          <input type="url" id="newPoster" value="https://peach.blender.org/wp-content/uploads/sintel_poster.jpg" required />
        </div>

        <div class="form-field" id="movieVideoField">
          <label>رابط الفيديو المباشر (للأفلام - MP4)</label>
          <input type="url" id="newVideo" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" />
        </div>

        <div class="form-field" id="seasonsJsonField" style="display:none;">
          <label>المواسم والحلقات (JSON للمسلسلات والأنمي)</label>
          <textarea id="newSeasonsJson" rows="6">[
  {
    "seasonNumber": 1,
    "title": "الموسم الأول",
    "episodes": [
      { "ep": 1, "name": "الحلقة 1", "duration": "10 د", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
    ]
  }
]</textarea>
        </div>

        <div class="form-field">
          <label>الوصف</label>
          <textarea id="newDesc" rows="2" placeholder="نبذة مختصرة عن العمل..." required></textarea>
        </div>

        <button type="submit" class="btn btn-green">حفظ في Firebase Firestore</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAQposIwGN_F9EbUqpxarN7guZ_IaZjvOQ",
      authDomain: "metaverse-metabox.firebaseapp.com",
      projectId: "metaverse-metabox",
      storageBucket: "metaverse-metabox.firebasestorage.app",
      messagingSenderId: "509642391976",
      appId: "1:509642391976:web:93746bbba00ad47bcb5d9d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const SAMPLE_V1 = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4";
    const SAMPLE_V2 = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
    const SAMPLE_V3 = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4";
    const SAMPLE_V4 = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";

    const DEFAULT_ITEMS = [
      {
        type: "movie",
        title: "Sintel",
        genre: "خيال علمي",
        year: "2010",
        metaText: "فيلم • 15 د",
        poster: "https://peach.blender.org/wp-content/uploads/sintel_poster.jpg",
        video: SAMPLE_V1,
        desc: "رحلة فتاة شجاعة تبحث عن تنين صغير في عالم مليء بالمخاطر والذكريات."
      },
      {
        type: "series",
        title: "وقائع السماء (مسلسل)",
        genre: "مغامرة",
        year: "2024",
        metaText: "مسلسل • موسمين",
        poster: "https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg",
        desc: "سلسلة مغامرات وتشويق تدور حول فريق يستكشف عوالم وأسراراً قديمة.",
        seasons: [
          {
            seasonNumber: 1,
            title: "الموسم الأول",
            episodes: [
              { ep: 1, name: "الحلقة 1: البداية", duration: "10 د", video: SAMPLE_V4 },
              { ep: 2, name: "الحلقة 2: الإشارة المفقودة", duration: "12 د", video: SAMPLE_V1 }
            ]
          },
          {
            seasonNumber: 2,
            title: "الموسم الثاني",
            episodes: [
              { ep: 1, name: "الحلقة 1: العودة", duration: "10 د", video: SAMPLE_V2 }
            ]
          }
        ]
      },
      {
        type: "anime",
        title: "وادي الأرنب (أنمي)",
        genre: "أنمي",
        year: "2023",
        metaText: "أنمي • موسم 1",
        poster: "https://peach.blender.org/wp-content/uploads/bbb-splash.png",
        desc: "عمل أنمي كوميدي ومغامرات في غابة نابضة بالحياة.",
        seasons: [
          {
            seasonNumber: 1,
            title: "الموسم الأول",
            episodes: [
              { ep: 1, name: "الحلقة 1: صباح هادئ", duration: "10 د", video: SAMPLE_V2 },
              { ep: 2, name: "الحلقة 2: فخ الغابة", duration: "11 د", video: SAMPLE_V3 }
            ]
          }
        ]
      }
    ];

    const LIST_KEY = "streamflix_fb_list_v1";
    const PROGRESS_KEY = "streamflix_fb_progress_v1";

    let catalog = [];
    let myList = JSON.parse(localStorage.getItem(LIST_KEY) || "[]");
    let progressMap = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
    let activeTab = "all";
    let heroItem = null;
    let currentItem = null;
    let currentSeasonIdx = 0;
    let currentEpIdx = 0;

    let autoNextTimer = null;
    let pendingNextTarget = null;

    const dbStatus = document.getElementById("dbStatus");
    const seedDataBtn = document.getElementById("seedDataBtn");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const searchInput = document.getElementById("searchInput");
    const genreSelect = document.getElementById("genreSelect");
    const hero = document.getElementById("hero");
    const heroBadge = document.getElementById("heroBadge");
    const heroTitle = document.getElementById("heroTitle");
    const heroDesc = document.getElementById("heroDesc");
    const heroPlayBtn = document.getElementById("heroPlayBtn");
    const heroListBtn = document.getElementById("heroListBtn");
    const myListSection = document.getElementById("myListSection");
    const myListGrid = document.getElementById("myListGrid");
    const catalogGrid = document.getElementById("catalogGrid");
    const mainSectionTitle = document.getElementById("mainSectionTitle");

    const playerModal = document.getElementById("playerModal");
    const closePlayerBtn = document.getElementById("closePlayerBtn");
    const videoPlayer = document.getElementById("videoPlayer");
    const modalTitle = document.getElementById("modalTitle");
    const infoTitle = document.getElementById("infoTitle");
    const infoDesc = document.getElementById("infoDesc");
    const modalToggleListBtn = document.getElementById("modalToggleListBtn");
    const episodesBox = document.getElementById("episodesBox");
    const seasonSelect = document.getElementById("seasonSelect");
    const episodesList = document.getElementById("episodesList");

    const nextEpBanner = document.getElementById("nextEpBanner");
    const nextEpName = document.getElementById("nextEpName");
    const nextEpCountdown = document.getElementById("nextEpCountdown");
    const playNextNowBtn = document.getElementById("playNextNowBtn");
    const cancelAutoNextBtn = document.getElementById("cancelAutoNextBtn");

    const addModal = document.getElementById("addModal");
    const openAddModalBtn = document.getElementById("openAddModalBtn");
    const closeAddBtn = document.getElementById("closeAddBtn");
    const addItemForm = document.getElementById("addItemForm");
    const newType = document.getElementById("newType");
    const movieVideoField = document.getElementById("movieVideoField");
    const seasonsJsonField = document.getElementById("seasonsJsonField");

    function clearAutoNext() {
      if (autoNextTimer) {
        clearInterval(autoNextTimer);
        autoNextTimer = null;
      }
      pendingNextTarget = null;
      nextEpBanner.classList.remove("show");
    }

    function getNextEpisodeTarget() {
      if (!currentItem || !Array.isArray(currentItem.seasons)) return null;
      const season = currentItem.seasons[currentSeasonIdx];
      if (!season || !Array.isArray(season.episodes)) return null;

      if (currentEpIdx + 1 < season.episodes.length) {
        return {
          sIdx: currentSeasonIdx,
          eIdx: currentEpIdx + 1,
          label: `${season.title || "الموسم " + (currentSeasonIdx + 1)} — ${season.episodes[currentEpIdx + 1].name}`
        };
      }

      if (currentSeasonIdx + 1 < currentItem.seasons.length) {
        const nextSeason = currentItem.seasons[currentSeasonIdx + 1];
        if (Array.isArray(nextSeason.episodes) && nextSeason.episodes.length > 0) {
          return {
            sIdx: currentSeasonIdx + 1,
            eIdx: 0,
            label: `${nextSeason.title || "الموسم " + (currentSeasonIdx + 2)} — ${nextSeason.episodes[0].name}`
          };
        }
      }

      return null;
    }

    function goToNextEpisodeNow() {
      if (!pendingNextTarget) return;
      const target = pendingNextTarget;
      clearAutoNext();
      currentSeasonIdx = target.sIdx;
      currentEpIdx = target.eIdx;
      renderSeasonsAndEpisodes();
    }

    function startAutoNextCountdown() {
      clearAutoNext();
      const nextTarget = getNextEpisodeTarget();
      if (!nextTarget) return;

      pendingNextTarget = nextTarget;
      let secondsLeft = 5;
      nextEpName.textContent = nextTarget.label;
      nextEpCountdown.textContent = String(secondsLeft);
      nextEpBanner.classList.add("show");

      autoNextTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          goToNextEpisodeNow();
        } else {
          nextEpCountdown.textContent = String(secondsLeft);
        }
      }, 1000);
    }

    function typeLabel(type) {
      if (type === "movie") return "فيلم";
      if (type === "series") return "مسلسل";
      if (type === "anime") return "أنمي";
      return type;
    }

    function saveList() { localStorage.setItem(LIST_KEY, JSON.stringify(myList)); }
    function saveProgress(id, sIdx, eIdx) {
      progressMap[id] = { sIdx, eIdx };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progressMap));
    }
    function isInList(id) { return myList.includes(id); }

    function toggleList(id) {
      if (!id) return;
      myList = isInList(id) ? myList.filter((x) => x !== id) : [...myList, id];
      saveList();
      renderAll();
      updateHeroListBtn();
      updateModalListBtn();
    }

    function updateHeroListBtn() {
      if (!heroItem) return;
      heroListBtn.textContent = isInList(heroItem.id) ? "✓ في قائمتي" : "+ قائمتي";
    }

    function updateModalListBtn() {
      if (!currentItem) return;
      modalToggleListBtn.textContent = isInList(currentItem.id) ? "إزالة من قائمتي" : "إضافة إلى قائمتي";
    }

    function setupHero(item) {
      if (!item) return;
      heroItem = item;
      hero.style.backgroundImage = `url('${item.poster}')`;
      heroBadge.textContent = `${typeLabel(item.type)} • ${item.genre}`;
      heroTitle.textContent = item.title;
      heroDesc.textContent = item.desc;
      updateHeroListBtn();
    }

    function playVideoSource(src, titleLabel) {
      clearAutoNext();
      modalTitle.textContent = titleLabel;
      videoPlayer.src = src;
      videoPlayer.play().catch(() => {});
    }

    function renderSeasonsAndEpisodes() {
      clearAutoNext();
      const hasEpisodes = Array.isArray(currentItem.seasons) && currentItem.seasons.length > 0;
      if (!hasEpisodes) {
        episodesBox.style.display = "none";
        playVideoSource(currentItem.video, `${currentItem.title} (${currentItem.year})`);
        return;
      }

      episodesBox.style.display = "block";
      seasonSelect.innerHTML = "";
      currentItem.seasons.forEach((s, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = s.title || `الموسم ${s.seasonNumber}`;
        seasonSelect.appendChild(opt);
      });
      seasonSelect.value = String(currentSeasonIdx);

      const season = currentItem.seasons[currentSeasonIdx] || currentItem.seasons[0];
      const ep = season.episodes[currentEpIdx] || season.episodes[0];
      saveProgress(currentItem.id, currentSeasonIdx, currentEpIdx);
      playVideoSource(ep.video, `${currentItem.title} — ${season.title} / ${ep.name}`);

      episodesList.innerHTML = "";
      season.episodes.forEach((episode, eIdx) => {
        const card = document.createElement("div");
        card.className = "ep-card" + (eIdx === currentEpIdx ? " active" : "");
        card.innerHTML = `<strong>${episode.name}</strong><span>المدة: ${episode.duration || "—"}</span>`;
        card.addEventListener("click", () => {
          currentEpIdx = eIdx;
          renderSeasonsAndEpisodes();
        });
        episodesList.appendChild(card);
      });
    }

    function openItemModal(item) {
      currentItem = item;
      const saved = progressMap[item.id];
      currentSeasonIdx = saved ? Math.min(saved.sIdx, (item.seasons?.length || 1) - 1) : 0;
      currentEpIdx = saved ? Math.min(saved.eIdx, (item.seasons?.[currentSeasonIdx]?.episodes?.length || 1) - 1) : 0;

      infoTitle.textContent = `${item.title} (${item.year})`;
      infoDesc.textContent = item.desc;
      updateModalListBtn();
      renderSeasonsAndEpisodes();
      playerModal.classList.add("open");
    }

    function closePlayer() {
      clearAutoNext();
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      playerModal.classList.remove("open");
    }

    function createCard(item) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <img src="${item.poster}" alt="${item.title}" loading="lazy" />
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <span class="type-pill">${typeLabel(item.type)}</span>
            <span>${item.metaText || item.genre}</span>
          </div>
        </div>
      `;
      card.addEventListener("click", () => openItemModal(item));
      return card;
    }

    function renderCatalog() {
      const q = searchInput.value.trim().toLowerCase();
      const g = genreSelect.value;

      const filtered = catalog.filter((item) => {
        const matchesTab =
          activeTab === "all" ||
          (activeTab === "mylist" && isInList(item.id)) ||
          item.type === activeTab;
        const matchesGenre = g === "all" || item.genre === g;
        const matchesQuery =
          !q ||
          item.title.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.genre.toLowerCase().includes(q);
        return matchesTab && matchesGenre && matchesQuery;
      });

      const titlesMap = {
        all: "كل الأفلام والمسلسلات والأنمي",
        movie: "الأفلام",
        series: "المسلسلات (المواسم والحلقات)",
        anime: "الأنمي",
        mylist: "نتائج قائمتي"
      };
      mainSectionTitle.textContent = titlesMap[activeTab] || "المحتوى المتاح";

      catalogGrid.innerHTML = "";
      if (!filtered.length) {
        catalogGrid.innerHTML = `<p class="empty-msg">لا توجد عناصر مطابقة حالياً.</p>`;
        return;
      }
      filtered.forEach((item) => catalogGrid.appendChild(createCard(item)));
    }

    function renderMyList() {
      myListSection.style.display = activeTab === "mylist" ? "none" : "block";
      const saved = catalog.filter((item) => isInList(item.id));
      myListGrid.innerHTML = "";
      if (!saved.length) {
        myListGrid.innerHTML = `<p class="empty-msg">قائمتك فارغة حالياً.</p>`;
        return;
      }
      saved.forEach((item) => myListGrid.appendChild(createCard(item)));
    }

    function renderAll() {
      renderMyList();
      renderCatalog();
    }

    async function loadCatalogFromFirebase() {
      try {
        const snap = await getDocs(collection(db, "catalog"));
        if (snap.empty) {
          dbStatus.textContent = "متصل بـ Firestore (metaverse-metabox) — المجموعة catalog فارغة حالياً";
          catalog = [];
        } else {
          catalog = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          dbStatus.textContent = `متصل بـ Firestore (metaverse-metabox) — ${catalog.length} عنصر`;
        }
        setupHero(catalog[1] || catalog[0]);
        renderAll();
      } catch (err) {
        console.error(err);
        dbStatus.textContent = "تعذر الاتصال بـ Firestore — تحقق من قواعد الأمان (Rules) في Firebase";
        catalog = DEFAULT_ITEMS.map((item, i) => ({ id: "fallback_" + i, ...item }));
        setupHero(catalog[1] || catalog[0]);
        renderAll();
      }
    }

    seedDataBtn.addEventListener("click", async () => {
      seedDataBtn.disabled = true;
      seedDataBtn.textContent = "جاري الإضافة...";
      try {
        for (const item of DEFAULT_ITEMS) {
          await addDoc(collection(db, "catalog"), item);
        }
        await loadCatalogFromFirebase();
      } catch (err) {
        alert("حدث خطأ أثناء الإضافة: " + err.message);
      } finally {
        seedDataBtn.disabled = false;
        seedDataBtn.textContent = "تعبئة بيانات تجريبية في Firestore";
      }
    });

    newType.addEventListener("change", () => {
      const isMovie = newType.value === "movie";
      movieVideoField.style.display = isMovie ? "flex" : "none";
      seasonsJsonField.style.display = isMovie ? "none" : "flex";
    });

    openAddModalBtn.addEventListener("click", () => addModal.classList.add("open"));
    closeAddBtn.addEventListener("click", () => addModal.classList.remove("open"));
    addModal.addEventListener("click", (e) => {
      if (e.target === addModal) addModal.classList.remove("open");
    });

    addItemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = newType.value;
      const title = document.getElementById("newTitle").value.trim();
      const genre = document.getElementById("newGenre").value;
      const year = document.getElementById("newYear").value.trim();
      const poster = document.getElementById("newPoster").value.trim();
      const desc = document.getElementById("newDesc").value.trim();

      const payload = {
        type,
        title,
        genre,
        year,
        poster,
        desc,
        metaText: typeLabel(type)
      };

      if (type === "movie") {
        payload.video = document.getElementById("newVideo").value.trim();
      } else {
        try {
          payload.seasons = JSON.parse(document.getElementById("newSeasonsJson").value);
        } catch (_) {
          alert("صيغة JSON للمواسم والحلقات غير صحيحة.");
          return;
        }
      }

      try {
        await addDoc(collection(db, "catalog"), payload);
        addModal.classList.remove("open");
        addItemForm.reset();
        await loadCatalogFromFirebase();
      } catch (err) {
        alert("فشل الحفظ في Firestore: " + err.message);
      }
    });

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.type;
        renderAll();
      });
    });

    seasonSelect.addEventListener("change", () => {
      currentSeasonIdx = Number(seasonSelect.value) || 0;
      currentEpIdx = 0;
      renderSeasonsAndEpisodes();
    });

    videoPlayer.addEventListener("ended", startAutoNextCountdown);
    playNextNowBtn.addEventListener("click", goToNextEpisodeNow);
    cancelAutoNextBtn.addEventListener("click", clearAutoNext);

    window.addEventListener("scroll", () => {
      document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 40);
    });

    searchInput.addEventListener("input", renderCatalog);
    genreSelect.addEventListener("change", renderCatalog);
    heroPlayBtn.addEventListener("click", () => openItemModal(heroItem));
    heroListBtn.addEventListener("click", () => toggleList(heroItem?.id));
    modalToggleListBtn.addEventListener("click", () => toggleList(currentItem?.id));
    closePlayerBtn.addEventListener("click", closePlayer);
    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) closePlayer();
    });

    loadCatalogFromFirebase();
  </script>
</body>
</html>

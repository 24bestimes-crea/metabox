
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="seoTitle">StreamFlix AI — منصة أفلام، مسلسلات، وأنمي</title>
  <meta id="seoDesc" name="description" content="منصة عرض سينمائية للأفلام والمسلسلات والأنمي مع صفوف أفقية وتنظيم ذكي بالذكاء الاصطناعي وربط مباشر بقاعدة بيانات Firebase." />
  <meta id="seoKeywords" name="keywords" content="أفلام, مسلسلات, أنمي, مواسم, حلقات, مشاهدة, ذكاء اصطناعي, Firebase" />
  <meta id="ogTitle" property="og:title" content="StreamFlix AI — أفلام، مسلسلات، وأنمي" />
  <meta id="ogDesc" property="og:description" content="تصفح أحدث الأفلام والمسلسلات والأنمي في صفوف أفقية مع عرض الوصف والنوع والسنة عند تمرير الماوس." />
  <meta id="ogType" property="og:type" content="website" />
  <script id="jsonLdSchema" type="application/ld+json">{}</script>

  <style>
    :root {
      --bg: #0a0b0e;
      --bg-row: #111318;
      --bg-card: #181c24;
      --text: #ffffff;
      --muted: #9ca3af;
      --red: #e50914;
      --red-glow: rgba(229, 9, 20, 0.35);
      --accent: #38bdf8;
      --gold: #fbbf24;
      --green: #10b981;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.45;
    }

    /* Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 4%;
      background: linear-gradient(to bottom, rgba(10,11,14,0.96), rgba(10,11,14,0.35));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent;
      transition: all 0.25s ease;
      flex-wrap: wrap;
    }

    header.scrolled {
      background: rgba(10, 11, 14, 0.98);
      border-bottom-color: var(--border);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--red);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span {
      font-size: 0.7rem;
      background: rgba(255,255,255,0.1);
      color: #e5e7eb;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 800;
    }

    .nav-tabs, .controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 0 16px var(--red-glow);
    }

    .controls input,
    .controls select,
    .modal select,
    .modal input,
    .modal textarea {
      background: #12151c;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.84rem;
      outline: none;
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play { background: #ffffff; color: #090a0d; }
    .btn-secondary { background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid var(--border); }
    .btn-accent { background: var(--accent); color: #05111a; }
    .btn-ai { background: linear-gradient(135deg, #6366f1, #38bdf8); color: #fff; }
    .btn-green { background: var(--green); color: #052e16; }
    .btn-red { background: var(--red); color: #fff; }

    /* Utility & Labels Bar */
    .top-utility {
      margin-top: 62px;
      padding: 8px 4%;
      background: #0f1116;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .utility-actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .labels-bar {
      padding: 10px 4%;
      background: #12141b;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }

    .label-chip {
      white-space: nowrap;
      background: var(--bg-card);
      color: #e5e7eb;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .label-chip.active {
      background: rgba(229, 9, 20, 0.18);
      border-color: var(--red);
      color: #fff;
    }

    /* Animated Marquee Slider */
    .marquee-wrap {
      padding: 11px 4%;
      background: #0d0f14;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .marquee-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .marquee-header strong { color: #fff; }

    .marquee-track-box { overflow: hidden; }

    .marquee-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: marqueeScroll 38s linear infinite;
    }

    .marquee-track-box:hover .marquee-track { animation-play-state: paused; }

    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    .slide-pill {
      width: 245px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .slide-pill img {
      width: 44px;
      height: 62px;
      object-fit: cover;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .slide-pill-info { min-width: 0; }
    .slide-pill-info strong {
      display: block;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slide-pill-info span { font-size: 0.7rem; color: var(--gold); font-weight: 700; }

    /* Compact Hero */
    .hero {
      position: relative;
      min-height: 44vh;
      display: flex;
      align-items: flex-end;
      padding: 32px 4% 38px;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, var(--bg) 6%, rgba(10,11,14,0.45) 55%, rgba(10,11,14,0.72) 100%),
        linear-gradient(to left, rgba(10,11,14,0.9) 0%, rgba(10,11,14,0.22) 65%);
    }

    .hero-content { position: relative; z-index: 2; max-width: 580px; }
    .hero-badge {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.5rem); margin-bottom: 8px; }
    .hero p { color: #e5e7eb; font-size: 0.9rem; margin-bottom: 14px; }

    /* Horizontal Shelf Rows */
    main { padding: 18px 4% 68px; }

    .shelf-section { margin-bottom: 30px; }

    .shelf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .shelf-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #f9fafb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .shelf-title .chevron { color: var(--muted); font-size: 1.15rem; }

    .shelf-wrapper { position: relative; }

    .shelf-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .shelf-row::-webkit-scrollbar { display: none; }

    .scroll-next-btn {
      position: absolute;
      top: 0;
      left: 0;
      height: calc(100% - 34px);
      width: 38px;
      background: linear-gradient(to right, rgba(10,11,14,0.92), rgba(10,11,14,0));
      border: none;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      opacity: 0.9;
    }

    .scroll-next-btn:hover { background: rgba(10,11,14,0.95); }

    /* Vertical Poster Card */
    .poster-card {
      flex: 0 0 165px;
      width: 165px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    @media (min-width: 768px) {
      .poster-card {
        flex: 0 0 182px;
        width: 182px;
      }
    }

    .poster-card:hover { transform: translateY(-4px); }

    .poster-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .poster-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.22s ease, transform 0.25s ease;
    }

    .poster-card:hover .poster-frame img {
      filter: brightness(0.32) blur(1px);
      transform: scale(1.03);
    }

    /* Hover Overlay: Type, Year, and Description */
    .hover-info-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: linear-gradient(
        to top,
        rgba(8, 10, 15, 0.97) 0%,
        rgba(12, 15, 22, 0.88) 65%,
        rgba(12, 15, 22, 0.72) 100%
      );
      padding: 36px 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-align: right;
    }

    .poster-card:hover .hover-info-overlay {
      opacity: 1;
    }

    .hover-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-wrap: wrap;
    }

    .hover-type-tag {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .hover-year-tag {
      background: rgba(251, 191, 36, 0.18);
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.35);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .hover-desc-text {
      font-size: 0.74rem;
      color: #f3f4f6;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .corner-n {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--red);
      color: #fff;
      font-weight: 900;
      font-size: 0.72rem;
      line-height: 1;
      padding: 4px 5px;
      border-radius: 2px;
      z-index: 3;
    }

    .top10-badge {
      position: absolute;
      top: 0;
      left: 8px;
      background: #dc2626;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 900;
      padding: 3px 5px;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      text-align: center;
      line-height: 1.05;
      z-index: 3;
    }

    .status-ribbon-wrap {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .poster-card:hover .status-ribbon-wrap {
      opacity: 0;
    }

    .ribbon-tag {
      background: var(--red);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }

    .ribbon-watch {
      background: #f3f4f6;
      color: #111827;
      font-size: 0.66rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .poster-caption { padding: 6px 2px 0; }

    .poster-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .poster-mini-actions {
      display: flex;
      gap: 4px;
      opacity: 0.85;
    }

    .mini-act {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #d1d5db;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 4px;
      cursor: pointer;
    }

    .mini-act.edit:hover { border-color: var(--accent); color: var(--accent); }
    .mini-act.del:hover { border-color: var(--red); color: #fca5a5; }

    .empty-msg { color: var(--muted); font-size: 0.9rem; padding: 8px 0; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 120;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 920px;
      max-height: 92vh;
      overflow-y: auto;
      background: #141821;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #0d1017;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .close-btn {
      background: transparent;
      color: #fff;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
    }

    video#videoPlayer {
      width: 100%;
      max-height: 55vh;
      background: #000;
      display: block;
    }

    .next-ep-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: #1f2534;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .next-ep-banner.show { display: flex; }
    .next-ep-text { font-size: 0.9rem; }
    .next-ep-text span { color: var(--accent); font-weight: 800; }

    .modal-info { padding: 16px 18px 22px; }
    .modal-info h3 { margin-bottom: 6px; font-size: 1.2rem; }
    .modal-info p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 14px; }

    .episodes-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .episodes-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .episodes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

    .ep-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .ep-card.active { border-color: var(--red); background: rgba(229, 9, 20, 0.16); }
    .ep-card strong { display: block; font-size: 0.88rem; margin-bottom: 3px; }
    .ep-card span { font-size: 0.76rem; color: var(--muted); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .form-field label { font-size: 0.82rem; color: var(--muted); }

    .labels-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .labels-picker label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header id="navbar">
    <a href="#" class="brand">STREAMFLIX <span>AI + ROWS</span></a>

    <nav class="nav-tabs" aria-label="الأقسام الرئيسية">
      <button class="tab-btn active" data-type="all">الكل</button>
      <button class="tab-btn" data-type="movie">أفلام</button>
      <button class="tab-btn" data-type="series">مسلسلات</button>
      <button class="tab-btn" data-type="anime">أنمي</button>
      <button class="tab-btn" data-type="mylist">قائمتي</button>
    </nav>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="ابحث..." aria-label="بحث" />
      <select id="genreSelect" aria-label="التصنيف">
        <option value="all">كل التصنيفات</option>
        <option value="خيال علمي">خيال علمي</option>
        <option value="مغامرة">مغامرة</option>
        <option value="أنمي">أنمي</option>
        <option value="أكشن">أكشن</option>
      </select>
      <button class="btn btn-ai" id="aiOrganizeBtn">✦ تنظيم ذكي بالـ AI</button>
      <button class="btn btn-accent" id="openAddModalBtn">+ إضافة</button>
    </div>
  </header>

  <div class="top-utility">
    <span id="dbStatus">حالة Firebase: جاري الاتصال بمشروع metaverse-metabox...</span>
    <span id="aiSummary">الذكاء الاصطناعي: جاهز لتنظيم الصفوف وتحديث السيو تلقائياً.</span>
    <div class="utility-actions">
      <button class="btn btn-secondary" id="downloadSitemapBtn" style="padding:4px 10px;font-size:0.76rem;">⬇ sitemap.xml</button>
      <button class="btn btn-secondary" id="downloadRobotsBtn" style="padding:4px 10px;font-size:0.76rem;">⬇ robots.txt</button>
      <button class="btn btn-secondary" id="seedDataBtn" style="padding:4px 10px;font-size:0.76rem;">تعبئة بيانات تجريبية</button>
    </div>
  </div>

  <!-- 7 Labels Filter Strip -->
  <div class="labels-bar" id="labelsBar" aria-label="التسميات السبعة"></div>

  <!-- Animated Marquee Slider -->
  <section class="marquee-wrap" aria-label="سلايدر متحرك">
    <div class="marquee-header">
      <strong>✦ شريط العروض والتسميات المتحرك</strong>
      <span id="activeFilterSummary">الكل • كل التسميات</span>
    </div>
    <div class="marquee-track-box">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
  </section>

  <!-- Compact Hero -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">مميز اليوم</span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="btn-row">
        <button class="btn btn-play" id="heroPlayBtn">▶ تشغيل الآن</button>
        <button class="btn btn-secondary" id="heroListBtn">+ قائمتي</button>
      </div>
    </div>
  </section>

  <!-- Horizontal Shelf Rows Container -->
  <main id="shelvesContainer"></main>

  <!-- Player Modal -->
  <div class="modal-backdrop" id="playerModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-top">
        <strong id="modalTitle">المشغّل</strong>
        <button class="close-btn" id="closePlayerBtn" aria-label="إغلاق">✕</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>

      <div class="next-ep-banner" id="nextEpBanner">
        <div class="next-ep-text">
          الحلقة التالية: <strong id="nextEpName"></strong> — سيتم التشغيل خلال <span id="nextEpCountdown">5</span> ثوانٍ
        </div>
        <div class="btn-row">
          <button class="btn btn-red" id="playNextNowBtn">▶ تشغيل الآن</button>
          <button class="btn btn-secondary" id="cancelAutoNextBtn">إلغاء</button>
        </div>
      </div>

      <div class="modal-info">
        <h3 id="infoTitle"></h3>
        <p id="infoDesc"></p>
        <div class="btn-row">
          <button class="btn btn-secondary" id="modalToggleListBtn"></button>
          <button class="btn btn-accent" id="modalEditItemBtn">✎ تعديل العمل</button>
          <button class="btn btn-red" id="modalDeleteItemBtn">🗑 حذف العمل</button>

    function escapeXml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function getBaseSiteUrl() {
      const origin = window.location.origin && window.location.origin !== "null"
        ? window.location.origin
        : "https://username.github.io";
      const path = window.location.pathname || "/";
      const dir = path.endsWith("/") ? path : path.substring(0, path.lastIndexOf("/") + 1);
      return `${origin}${dir}`;
    }

    function triggerFileDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function generateSitemapXml() {
      const baseUrl = getBaseSiteUrl();
      const today = new Date().toISOString().split("T")[0];
      const staticPaths = ["", "?tab=movie", "?tab=series", "?tab=anime"];

      const itemUrls = catalog.map((item) => {
        const slug = encodeURIComponent(String(item.id || item.title || "item"));
        return `
  <url>
    <loc>${escapeXml(baseUrl)}?item=${slug}</loc>
    <lastmod>${today}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>`;
      });

      const baseUrls = staticPaths.map((p, idx) => `
  <url>
    <loc>${escapeXml(baseUrl + p)}</loc>
    <lastmod>${today}</lastmod>
    <changefreq>daily</changefreq>
    <priority>${idx === 0 ? "1.0" : "0.9"}</priority>
  </url>`);

      return `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">${baseUrls.join("")}${itemUrls.join("")}
</urlset>`;
    }

    async function deleteCatalogItem(item) {
      if (!item || !item.id) return;
      const confirmed = confirm(`هل أنت متأكد من حذف "${item.title}" نهائياً من Firestore؟`);
      if (!confirmed) return;

      if (String(item.id).startsWith("fallback_")) {
        catalog = catalog.filter((x) => x.id !== item.id);
        myList = myList.filter((id) => id !== item.id);
        saveList();
        if (currentItem?.id === item.id) closePlayer();
        renderAll();
        return;
      }

      try {
        await deleteDoc(doc(db, "catalog", item.id));
        myList = myList.filter((id) => id !== item.id);
        saveList();
        if (currentItem?.id === item.id) {
          closePlayer();
        }
        await loadCatalogFromFirebase();
      } catch (err) {
        alert("فشل الحذف من Firestore: " + err.message);
      }
    }

    function aiNormalizeItem(item) {
      const labels = Array.isArray(item.labels) && item.labels.length
        ? item.labels.filter((l) => SEVEN_LABELS.includes(l))
        : [];
      const yearNum = parseInt(item.year, 10) || 2020;

      if (!labels.length) {
        if (yearNum >= 2025) labels.push("جديد", "رائج الآن");
        else if (yearNum <= 2014) labels.push("كلاسيكي", "مترجم");
        else labels.push("الأعلى تقييماً", "حصري");
      }

      const ribbon = item.ribbon !== undefined
        ? item.ribbon
        : (labels.includes("جديد") ? "New Season" : (labels.includes("رائج الآن") ? "New Episode" : ""));

      const top10 = typeof item.top10 === "boolean"
        ? item.top10
        : labels.includes("الأعلى تقييماً");

      const aiScore =
        (labels.includes("رائج الآن") ? 35 : 0) +
        (labels.includes("جديد") ? 25 : 0) +
        (labels.includes("الأعلى تقييماً") ? 25 : 0) +
        (labels.includes("حصري") ? 15 : 0) +
        (myList.includes(item.id) ? 30 : 0) +
        Math.max(0, (yearNum - 2000));

      return {
        ...item,
        year: String(item.year || "2025"),
        desc: item.desc || "عمل متاح للمشاهدة عبر المنصة.",
        labels: labels.slice(0, 3),
        ribbon,
        top10,
        aiScore
      };
    }

    function organizeWithAI(showToast = false) {
      catalog = catalog.map(aiNormalizeItem);
      if (aiSortedEnabled) {
        catalog.sort((a, b) => b.aiScore - a.aiScore);
      }

      const counts = {
        movie: catalog.filter((i) => i.type === "movie").length,
        series: catalog.filter((i) => i.type === "series").length,
        anime: catalog.filter((i) => i.type === "anime").length
      };
      aiSummary.textContent =
        `AI منظم: ${counts.movie} أفلام • ${counts.series} مسلسلات • ${counts.anime} أنمي` +
        (aiSortedEnabled ? " (مرتب حسب الأولوية الذكية)" : "");

      if (showToast) {
        aiSortedEnabled = true;
        localStorage.setItem(AI_SORT_KEY, "1");
        catalog.sort((a, b) => b.aiScore - a.aiScore);
        renderAll();
      }
    }

    function applyAutoSEO(focusItem = null) {
      const titleEl = document.getElementById("seoTitle");
      const descEl = document.getElementById("seoDesc");
      const kwEl = document.getElementById("seoKeywords");
      const ogTitleEl = document.getElementById("ogTitle");
      const ogDescEl = document.getElementById("ogDesc");
      const schemaEl = document.getElementById("jsonLdSchema");

      if (focusItem) {
        const pageTitle = `${focusItem.title} (${focusItem.year || ""}) — StreamFlix AI`;
        const pageDesc = `${focusItem.desc} | تصنيف: ${focusItem.genre} | ${typeLabel(focusItem.type)}`;
        titleEl.textContent = pageTitle;
        descEl.setAttribute("content", pageDesc);
        ogTitleEl.setAttribute("content", pageTitle);
        ogDescEl.setAttribute("content", pageDesc);

        schemaEl.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": focusItem.type === "movie" ? "Movie" : "TVSeries",
          "name": focusItem.title,
          "description": focusItem.desc,
          "genre": focusItem.genre,
          "datePublished": String(focusItem.year || ""),
          "image": focusItem.poster
        });
        return;
      }

      const tabNames = {
        all: "Your Next Watch",
        movie: "Movies",
        series: "TV Shows",
        anime: "Anime",
        mylist: "My List"
      };
      const labelText = activeLabel === "all" ? "All Labels" : activeLabel;
      const pageTitle = `${tabNames[activeTab] || "Catalog"} — ${labelText} | StreamFlix AI`;
      const pageDesc = `مشاهدة ${tabNames[activeTab] || "المحتوى"} ضمن تسمية ${labelText} مع صفوف أفقية وعرض الوصف والنوع والسنة عند تمرير الماوس.`;

      titleEl.textContent = pageTitle;
      descEl.setAttribute("content", pageDesc);
      ogTitleEl.setAttribute("content", pageTitle);
      ogDescEl.setAttribute("content", pageDesc);
      kwEl.setAttribute("content", `StreamFlix, ${tabNames[activeTab]}, ${labelText}, ${SEVEN_LABELS.join(", ")}`);

      schemaEl.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": pageTitle,
        "numberOfItems": catalog.length,
        "itemListElement": catalog.slice(0, 12).map((item, idx) => ({
          "@type": "ListItem",
          "position": idx + 1,
          "name": item.title,
          "url": window.location.href
        }))
      });
    }

    function renderMarqueeSlider() {
      const source = catalog.length ? catalog : DEFAULT_ITEMS.map((d, i) => aiNormalizeItem({ id: "def_" + i, ...d }));
      const loopItems = [...source, ...source];
      marqueeTrack.innerHTML = "";

      loopItems.forEach((item) => {
        const pill = document.createElement("div");
        pill.className = "slide-pill";
        const firstLabel = (item.labels && item.labels[0]) || "جديد";
        pill.innerHTML = `
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <div class="slide-pill-info">
            <strong>${item.title}</strong>
            <span>#${firstLabel} • ${typeLabel(item.type)}</span>
          </div>
        `;
        pill.addEventListener("click", () => openItemModal(item));
        marqueeTrack.appendChild(pill);
      });
    }

    function createPosterCard(item) {
      const card = document.createElement("article");
      card.className = "poster-card";

      const watchNowBadge = item.showWatchNow
        ? `<span class="ribbon-watch">Watch Now</span>`
        : "";
      const ribbonBadge = item.ribbon
        ? `<span class="ribbon-tag">${item.ribbon}</span>`
        : "";
      const top10Badge = item.top10
        ? `<div class="top10-badge">TOP<br/>10</div>`
        : "";

      const fullTypeText = `${typeLabel(item.type)}${item.genre ? " • " + item.genre : ""}`;
      const yearText = item.year || "—";
      const descText = item.desc || "لا يوجد وصف متاح لهذا العمل.";

      card.innerHTML = `
        <div class="poster-frame">
          <span class="corner-n">N</span>
          ${top10Badge}
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <div class="hover-info-overlay" aria-hidden="true">
            <div class="hover-meta-row">
              <span class="hover-type-tag">${fullTypeText}</span>
              <span class="hover-year-tag">${yearText}</span>
            </div>
            <p class="hover-desc-text">${descText}</p>
          </div>
          <div class="status-ribbon-wrap">
            ${ribbonBadge}
            ${watchNowBadge}
          </div>
        </div>
        <div class="poster-caption">
          <div class="poster-name" title="${item.title}">${item.title}</div>
          <div class="poster-mini-actions">
            <button type="button" class="mini-act edit">✎ تعديل</button>
            <button type="button" class="mini-act del">🗑 حذف</button>
          </div>
        </div>
      `;

      const editBtn = card.querySelector(".mini-act.edit");
      const delBtn = card.querySelector(".mini-act.del");

      editBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openEditModal(item);
      });

      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteCatalogItem(item);
      });

      card.addEventListener("click", () => openItemModal(item));
      return card;
    }

    function buildHorizontalShelf(titleText, items) {
      const section = document.createElement("section");
      section.className = "shelf-section";

      const header = document.createElement("div");
      header.className = "shelf-header";
      header.innerHTML = `<h2 class="shelf-title">${titleText} <span class="chevron">›</span></h2>`;
      section.appendChild(header);

      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty-msg";
        empty.textContent = "لا توجد عناصر في هذا الصف حالياً.";
        section.appendChild(empty);
        return section;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "shelf-wrapper";

      const row = document.createElement("div");
      row.className = "shelf-row";
      items.forEach((item) => row.appendChild(createPosterCard(item)));

      const nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "scroll-next-btn";
      nextBtn.setAttribute("aria-label", "تمرير الصف");
      nextBtn.textContent = "›";
      nextBtn.addEventListener("click", () => {
        row.scrollBy({ left: -540, behavior: "smooth" });
      });

      wrapper.appendChild(row);
      wrapper.appendChild(nextBtn);
      section.appendChild(wrapper);
      return section;
    }

    function renderShelves() {
      const q = searchInput.value.trim().toLowerCase();
      const g = genreSelect.value;

      const tabNames = {
        all: "الكل",
        movie: "أفلام",
        series: "مسلسلات",
        anime: "أنمي",
        mylist: "قائمتي"
      };
      activeFilterSummary.textContent = `${tabNames[activeTab]} • ${activeLabel === "all" ? "كل التسميات (7)" : activeLabel}`;

      const filtered = catalog.filter((item) => {
        const matchesTab =
          activeTab === "all" ||
          (activeTab === "mylist" && isInList(item.id)) ||
          item.type === activeTab;
        const matchesGenre = g === "all" || item.genre === g;
        const matchesLabel =
          activeLabel === "all" ||
          (Array.isArray(item.labels) && item.labels.includes(activeLabel));
        const matchesQuery =
          !q ||
          item.title.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.genre.toLowerCase().includes(q) ||
          String(item.year || "").toLowerCase().includes(q) ||
          (item.labels || []).some((l) => l.toLowerCase().includes(q));

        return matchesTab && matchesGenre && matchesLabel && matchesQuery;
      });

      shelvesContainer.innerHTML = "";

      if (!filtered.length) {
        shelvesContainer.innerHTML = `<p class="empty-msg">لا توجد عناصر مطابقة للتصفية الحالية.</p>`;
        return;
      }

      const savedList = filtered.filter((item) => isInList(item.id));
      const awardOrTop = filtered.filter((item) => item.top10 || (item.labels || []).includes("الأعلى تقييماً"));
      const animeOrDrama = filtered.filter((item) => item.type === "anime" || (item.labels || []).includes("مترجم"));
      const criticallyAcclaimed = filtered.filter((item) => (item.labels || []).includes("حصري") || (item.labels || []).includes("رائج الآن"));

      shelvesContainer.appendChild(buildHorizontalShelf("Your Next Watch", filtered));
      if (savedList.length) {
        shelvesContainer.appendChild(buildHorizontalShelf("My List • قائمتي", savedList));
      }
      shelvesContainer.appendChild(buildHorizontalShelf("Award-Winning TV Shows", awardOrTop.length ? awardOrTop : filtered));
      shelvesContainer.appendChild(buildHorizontalShelf("K-Dramas & Anime", animeOrDrama.length ? animeOrDrama : filtered));
      shelvesContainer.appendChild(buildHorizontalShelf("Critically Acclaimed TV Shows", criticallyAcclaimed.length ? criticallyAcclaimed : filtered));
    }

    // Auto-Next Episode Countdown (5s starting 25s before end)
    function clearAutoNext(markDismissed = false) {
      if (autoNextTimer) {
        clearInterval(autoNextTimer);
        autoNextTimer = null;
      }
      pendingNextTarget = null;
      if (markDismissed) dismissedForCurrentEp = true;
      nextEpBanner.classList.remove("show");
    }

    function getNextEpisodeTarget() {
      if (!currentItem || !Array.isArray(currentItem.seasons)) return null;
      const season = currentItem.seasons[currentSeasonIdx];
      if (!season || !Array.isArray(season.episodes)) return null;

      if (currentEpIdx + 1 < season.episodes.length) {
        return {
          sIdx: currentSeasonIdx,
          eIdx: currentEpIdx + 1,
          label: `${season.title || "الموسم " + (currentSeasonIdx + 1)} — ${season.episodes[currentEpIdx + 1].name}`
        };
      }

      if (currentSeasonIdx + 1 < currentItem.seasons.length) {
        const nextSeason = currentItem.seasons[currentSeasonIdx + 1];
        if (Array.isArray(nextSeason.episodes) && nextSeason.episodes.length > 0) {
          return {
            sIdx: currentSeasonIdx + 1,
            eIdx: 0,
            label: `${nextSeason.title || "الموسم " + (currentSeasonIdx + 2)} — ${nextSeason.episodes[0].name}`
          };
        }
      }
      return null;
    }

    function goToNextEpisodeNow() {
      if (!pendingNextTarget) return;
      const target = pendingNextTarget;
      clearAutoNext(false);
      currentSeasonIdx = target.sIdx;
      currentEpIdx = target.eIdx;
      renderSeasonsAndEpisodes();
    }

    function startAutoNextCountdown() {
      if (autoNextTimer || dismissedForCurrentEp) return;
      const nextTarget = getNextEpisodeTarget();
      if (!nextTarget) return;

      pendingNextTarget = nextTarget;
      let secondsLeft = 5;
      nextEpName.textContent = nextTarget.label;
      nextEpCountdown.textContent = String(secondsLeft);
      nextEpBanner.classList.add("show");

      autoNextTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          goToNextEpisodeNow();
        } else {
          nextEpCountdown.textContent = String(secondsLeft);
        }
      }, 1000);
    }

    function handleTimeUpdate() {
      if (autoNextTimer || dismissedForCurrentEp) return;
      const dur = videoPlayer.duration;
      if (!Number.isFinite(dur) || dur <= 0) return;
      const remaining = dur - videoPlayer.currentTime;
      if (remaining <= PRE_END_SECONDS && remaining > 0) {
        startAutoNextCountdown();
      }
    }

    function saveList() { localStorage.setItem(LIST_KEY, JSON.stringify(myList)); }
    function saveProgress(id, sIdx, eIdx) {
      progressMap[id] = { sIdx, eIdx };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progressMap));
    }
    function isInList(id) { return myList.includes(id); }

    function toggleList(id) {
      if (!id) return;
      myList = isInList(id) ? myList.filter((x) => x !== id) : [...myList, id];
      saveList();
      renderAll();
      updateHeroListBtn();
      updateModalListBtn();
    }

    function updateHeroListBtn() {
      if (!heroItem) return;
      heroListBtn.textContent = isInList(heroItem.id) ? "✓ في قائمتي" : "+ قائمتي";
    }

    function updateModalListBtn() {
      if (!currentItem) return;
      modalToggleListBtn.textContent = isInList(currentItem.id) ? "إزالة من قائمتي" : "إضافة إلى قائمتي";
    }

    function setupHero(item) {
      if (!item) return;
      heroItem = item;
      hero.style.backgroundImage = `url('${item.poster}')`;
      const lbl = item.ribbon || (item.labels && item.labels[0]) || "مميز اليوم";
      heroBadge.textContent = `${lbl} • ${typeLabel(item.type)} • ${item.genre}`;
      heroTitle.textContent = item.title;
      heroDesc.textContent = item.desc;
      updateHeroListBtn();
    }

    function playVideoSource(src, titleLabel) {
      dismissedForCurrentEp = false;
      clearAutoNext(false);
      modalTitle.textContent = titleLabel;
      videoPlayer.src = src;
      videoPlayer.play().catch(() => {});
    }

    function renderSeasonsAndEpisodes() {
      clearAutoNext(false);
      dismissedForCurrentEp = false;
      const hasEpisodes = Array.isArray(currentItem.seasons) && currentItem.seasons.length > 0;
      if (!hasEpisodes) {
        episodesBox.style.display = "none";
        playVideoSource(currentItem.video, `${currentItem.title} (${currentItem.year})`);
        return;
      }

      episodesBox.style.display = "block";
      seasonSelect.innerHTML = "";
      currentItem.seasons.forEach((s, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = s.title || `الموسم ${s.seasonNumber}`;
        seasonSelect.appendChild(opt);
      });
      seasonSelect.value = String(currentSeasonIdx);

      const season = currentItem.seasons[currentSeasonIdx] || currentItem.seasons[0];
      const ep = season.episodes[currentEpIdx] || season.episodes[0];
      saveProgress(currentItem.id, currentSeasonIdx, currentEpIdx);
      playVideoSource(ep.video, `${currentItem.title} — ${season.title} / ${ep.name}`);

      episodesList.innerHTML = "";
      season.episodes.forEach((episode, eIdx) => {
        const card = document.createElement("div");
        card.className = "ep-card" + (eIdx === currentEpIdx ? " active" : "");
        card.innerHTML = `<strong>${episode.name}</strong><span>المدة: ${episode.duration || "—"}</span>`;
        card.addEventListener("click", () => {
          currentEpIdx = eIdx;
          renderSeasonsAndEpisodes();
        });
        episodesList.appendChild(card);
      });
    }

    function openItemModal(item) {
      currentItem = item;
      applyAutoSEO(item);
      const saved = progressMap[item.id];
      currentSeasonIdx = saved ? Math.min(saved.sIdx, (item.seasons?.length || 1) - 1) : 0;
      currentEpIdx = saved ? Math.min(saved.eIdx, (item.seasons?.[currentSeasonIdx]?.episodes?.length || 1) - 1) : 0;

      infoTitle.textContent = `${item.title} (${item.year})`;
      infoDesc.textContent = item.desc;
      updateModalListBtn();
      renderSeasonsAndEpisodes();
      playerModal.classList.add("open");
    }

    function closePlayer() {
      clearAutoNext(false);
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      playerModal.classList.remove("open");
      applyAutoSEO(null);
    }

    function renderAll() {
      renderShelves();
      renderMarqueeSlider();
      applyAutoSEO(null);
    }

    async function loadCatalogFromFirebase() {
      try {
        const snap = await getDocs(collection(db, "catalog"));
        if (snap.empty) {
          dbStatus.textContent = "متصل بـ Firestore (metaverse-metabox) — المجموعة catalog فارغة حالياً";
          catalog = [];
        } else {
          catalog = snap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
          dbStatus.textContent = `متصل بـ Firestore (metaverse-metabox) — ${catalog.length} عنصر`;
        }
        organizeWithAI(false);
        setupHero(catalog[2] || catalog[0]);
        renderAll();
      } catch (err) {
        console.error(err);
        dbStatus.textContent = "تعذر الاتصال بـ Firestore — تحقق من قواعد الأمان (Rules)";
        catalog = DEFAULT_ITEMS.map((item, i) => ({ id: "fallback_" + i, ...item }));
        organizeWithAI(false);
        setupHero(catalog[2] || catalog[0]);
        renderAll();
      }
    }

    downloadSitemapBtn.addEventListener("click", () => {
      triggerFileDownload("sitemap.xml", generateSitemapXml(), "application/xml;charset=utf-8");
    });

    downloadRobotsBtn.addEventListener("click", () => {
      triggerFileDownload("robots.txt", generateRobotsTxt(), "text/plain;charset=utf-8");
    });

    seedDataBtn.addEventListener("click", async () => {
      seedDataBtn.disabled = true;
      seedDataBtn.textContent = "جاري الإضافة...";
      try {
        for (const item of DEFAULT_ITEMS) {
          await addDoc(collection(db, "catalog"), item);
        }
        await loadCatalogFromFirebase();
      } catch (err) {
        alert("حدث خطأ أثناء الإضافة: " + err.message);
      } finally {
        seedDataBtn.disabled = false;
        seedDataBtn.textContent = "تعبئة بيانات تجريبية";
      }
    });

    aiOrganizeBtn.addEventListener("click", () => organizeWithAI(true));
    newType.addEventListener("change", toggleFormFieldsByType);

    openAddModalBtn.addEventListener("click", openAddModal);
    closeAddBtn.addEventListener("click", () => addModal.classList.remove("open"));
    addModal.addEventListener("click", (e) => {
      if (e.target === addModal) addModal.classList.remove("open");
    });

    modalEditItemBtn.addEventListener("click", () => {
      if (currentItem) openEditModal(currentItem);
    });

    modalDeleteItemBtn.addEventListener("click", () => {
      if (currentItem) deleteCatalogItem(currentItem);
    });

    addItemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = newType.value;
      const title = document.getElementById("newTitle").value.trim();
      const genre = document.getElementById("newGenre").value;
      const year = document.getElementById("newYear").value.trim();
      const ribbon = document.getElementById("newRibbon").value.trim();
      const poster = document.getElementById("newPoster").value.trim();
      const desc = document.getElementById("newDesc").value.trim();

      const selectedLabels = Array.from(
        newLabelsPicker.querySelectorAll("input[type='checkbox']:checked")
      ).map((cb) => cb.value);

      const payload = {
        type,
        title,
        genre,
        year,
        ribbon,
        showWatchNow: ribbon.toLowerCase().includes("episode"),
        top10: selectedLabels.includes("الأعلى تقييماً"),
        poster,
        labels: selectedLabels.length ? selectedLabels : ["جديد"],
        desc
      };

      if (type === "movie") {
        payload.video = document.getElementById("newVideo").value.trim();
        payload.seasons = [];
      } else {
        try {
          payload.seasons = JSON.parse(document.getElementById("newSeasonsJson").value);
        } catch (_) {
          alert("صيغة JSON للمواسم والحلقات غير صحيحة.");
          return;
        }
      }

      try {
        if (editingItemId && !String(editingItemId).startsWith("fallback_")) {
          await updateDoc(doc(db, "catalog", editingItemId), payload);
          if (currentItem?.id === editingItemId) {
            currentItem = { id: editingItemId, ...payload };
            infoTitle.textContent = `${currentItem.title} (${currentItem.year})`;
            infoDesc.textContent = currentItem.desc;
            renderSeasonsAndEpisodes();
            applyAutoSEO(currentItem);
          }
        } else {
          await addDoc(collection(db, "catalog"), payload);
        }

        editingItemId = null;
        addModal.classList.remove("open");
        addItemForm.reset();
        renderLabelsUI();
        await loadCatalogFromFirebase();
      } catch (err) {
        alert("فشل الحفظ في Firestore: " + err.message);
      }
    });

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.type;
        renderAll();
      });
    });

    seasonSelect.addEventListener("change", () => {
      currentSeasonIdx = Number(seasonSelect.value) || 0;
      currentEpIdx = 0;
      renderSeasonsAndEpisodes();
    });

    videoPlayer.addEventListener("timeupdate", handleTimeUpdate);
    videoPlayer.addEventListener("ended", startAutoNextCountdown);
    playNextNowBtn.addEventListener("click", goToNextEpisodeNow);
    cancelAutoNextBtn.addEventListener("click", () => clearAutoNext(true));

    window.addEventListener("scroll", () => {
      document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 40);
    });

    searchInput.addEventListener("input", renderShelves);
    genreSelect.addEventListener("change", renderShelves);
    heroPlayBtn.addEventListener("click", () => openItemModal(heroItem));
    heroListBtn.addEventListener("click", () => toggleList(heroItem?.id));
    modalToggleListBtn.addEventListener("click", () => toggleList(currentItem?.id));
    closePlayerBtn.addEventListener("click", closePlayer);
    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) closePlayer();
    });

    renderLabelsUI();
    loadCatalogFromFirebase();
  </script>
</body>
</html>

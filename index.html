
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metaverse World - Alpha V7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  /* ===== الخلفية المتحركة (عادت) ===== */
  #login-bg-canvas { position: absolute; inset: 0; z-index: 1; background: #0f0c29; }

  /* ===== شاشة الدخول ===== */
  #login-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; transition: opacity 0.6s ease;
  }
  #login-screen h1 {
    font-size: 3rem; margin-bottom: 0.5rem; z-index: 2; text-shadow: 0 0 20px rgba(0,210,255,0.5);
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #login-screen p { color: #ccc; margin-bottom: 2rem; font-size: 1.1rem; z-index: 2; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; z-index: 2;
    display: flex; flex-direction: column; width: 350px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  .glass-panel input {
    width: 100%; padding: 12px 15px; margin-bottom: 15px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; font-size: 1rem; outline: none; transition: 0.3s;
  }
  .glass-panel input:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3); }
  .btn {
    width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .btn:hover { transform: scale(1.02); }
  .btn-primary { background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white; }
  .btn-google { background: white; color: #333; }
  .btn-guest { background: transparent; color: #ccc; border: 1px solid rgba(255,255,255,0.3); }
  .btn-link { background: none; border: none; color: #00d2ff; cursor: pointer; font-size: 0.9rem; margin-top: 10px; }
  .divider { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #666; font-size: 0.9rem; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .divider::before { margin-left: 10px; } .divider::after { margin-right: 10px; }

  /* ===== شاشة العالم ===== */
  #world-screen { display: none; position: fixed; inset: 0; background: #000; }
  #canvas-container { width: 100%; height: 100%; display: block; }

  #loading {
    position: absolute; inset: 0; background: #0f0c29; color: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s;
  }
  .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00d2ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .hud-panel { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; color: white; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 15px; }
  .stat-bar { width: 100px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
  .stat-fill { height: 100%; width: 100%; transition: width 0.3s; }
  .health-fill { background: #ff4757; } .energy-fill { background: #00d2ff; }

  #btn-logout, #btn-profile { position: absolute; top: 80px; padding: 8px 20px; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 0.85rem; z-index: 10; backdrop-filter: blur(4px); }
  #btn-logout { right: 20px; background: rgba(255,60,60,0.8); }
  #btn-profile { right: 120px; background: rgba(0,210,255,0.8); }

  #profile-menu { position: absolute; inset: 0; background: rgba(15,12,41,0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; backdrop-filter: blur(10px); }
  .profile-card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 40px; align-items: center; }
  .avatar-display { width: 150px; height: 150px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; border: 3px solid #00d2ff; }
  .profile-info { display: flex; flex-direction: column; gap: 10px; }
  .profile-info input { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 1rem; outline: none; width: 250px; }

  #animal-card { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 15px 30px; border-radius: 15px; border: 2px solid #f1c40f; display: none; text-align: center; z-index: 10; }

  #joystick-zone { display: none; position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); z-index: 10; }
  #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,210,255,0.6); transform: translate(-50%, -50%); }
  @media (pointer: coarse) { #joystick-zone { display: block; } }
</style>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="login-screen">
  <canvas id="login-bg-canvas"></canvas>
  <h1>Metaverse World</h1>
  <p>عالم افتراضي متكامل</p>
  <div class="glass-panel" id="auth-panel">
    <div id="login-form">
      <input type="email" id="login-email" placeholder="البريد الإلكتروني">
      <input type="password" id="login-password" placeholder="كلمة المرور">
      <button class="btn btn-primary" id="btn-login-submit">تسجيل الدخول</button>
      <button class="btn-link" id="link-to-signup">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
    </div>
    <div id="signup-form" style="display: none;">
      <input type="text" id="signup-name" placeholder="اسم اللاعب">
      <input type="email" id="signup-email" placeholder="البريد الإلكتروني">
      <input type="password" id="signup-password" placeholder="كلمة المرور (6 أحرف على الأقل)">
      <button class="btn btn-primary" id="btn-signup-submit">إنشاء الحساب</button>
      <button class="btn-link" id="link-to-login">لديك حساب بالفعل؟ سجل الدخول</button>
    </div>
    <div class="divider">أو</div>
    <button class="btn btn-google" id="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> تسجيل الدخول بـ Google</button>
    <button class="btn btn-guest" id="btn-guest">دخول سريع (تجريبي)</button>
  </div>
</div>

<!-- ===== شاشة العالم ===== -->
<div id="world-screen">
  <div id="loading"><div class="spinner"></div>جاري تحميل العالم...</div>
  <div id="canvas-container"></div>
  
  <div id="hud">
    <div class="hud-panel">
      <div style="display:flex; flex-direction:column; gap:5px;"><span style="font-size:0.8rem;">الصحة</span><div class="stat-bar"><div class="stat-fill health-fill"></div></div></div>
      <div style="display:flex; flex-direction:column; gap:5px;"><span style="font-size:0.8rem;">الطاقة</span><div class="stat-bar"><div class="stat-fill energy-fill"></div></div></div>
    </div>
    <div class="hud-panel" style="pointer-events:auto;">
      <span>مرحباً، <span id="player-name" style="color:#00d2ff; font-weight:bold;">لاعب</span></span>
      <span style="color:#8899aa; font-size:0.8rem;">(Space = قفز | Shift = جري)</span>
    </div>
  </div>

  <button id="btn-profile">👤 الملف الشخصي</button>
  <button id="btn-logout">خروج</button>
  
  <div id="profile-menu">
    <h2 style="color:#00d2ff; margin-bottom:20px;">الملف الشخصي</h2>
    <div class="profile-card">
      <div class="avatar-display">🚀</div>
      <div class="profile-info">
        <label style="color:#8899aa; font-size:0.9rem;">اسم اللاعب:</label>
        <input type="text" id="input-name" placeholder="اكتب اسمك...">
        <label style="color:#8899aa; font-size:0.9rem;">المستوى:</label>
        <input type="text" value="المستوى 1 (مبتدئ)" disabled style="color:#888;">
      </div>
    </div>
    <button class="btn btn-primary" id="btn-close-profile" style="width:200px; margin-top:20px; background:#ff4757;">إغلاق القائمة</button>
  </div>

  <div id="animal-card">
    <h3 id="ac-name" style="color:#f1c40f;">اسم الحيوان</h3>
    <p id="ac-level">المستوى: 1</p>
    <p id="ac-req" style="font-size:0.8rem; color:#ff4757; margin-top:5px;">تحتاج مستوى 2 للترويض</p>
  </div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyAQposIwGN_F9EbUqpxarN7guZ_IaZjvOQ",
  authDomain: "metaverse-metabox.firebaseapp.com",
  projectId: "metaverse-metabox",
  storageBucket: "metaverse-metabox.firebasestorage.app",
  messagingSenderId: "509642391976",
  appId: "1:509642391976:web:93746bbba00ad47bcb5d9d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// DOM
const loginScreen = document.getElementById('login-screen');
const worldScreen = document.getElementById('world-screen');
const playerNameEl = document.getElementById('player-name');
const btnLogout = document.getElementById('btn-logout');
const loadingEl = document.getElementById('loading');
const profileMenu = document.getElementById('profile-menu');
const btnProfile = document.getElementById('btn-profile');
const btnCloseProfile = document.getElementById('btn-close-profile');
const inputName = document.getElementById('input-name');
const animalCard = document.getElementById('animal-card');
const acName = document.getElementById('ac-name');
const acLevel = document.getElementById('ac-level');
const acReq = document.getElementById('ac-req');

// ===== الخلفية المتحركة (Canvas) =====
const bgCanvas = document.getElementById('login-bg-canvas');
const ctx = bgCanvas.getContext('2d');
let bgShapes = [];
function initBgCanvas() {
  bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; bgShapes = [];
  for(let i=0; i<50; i++) {
    bgShapes.push({ x: Math.random() * bgCanvas.width, y: Math.random() * bgCanvas.height, size: Math.random() * 30 + 10, speedX: (Math.random() - 0.5) * 1, speedY: (Math.random() - 0.5) * 1, type: Math.random() > 0.5 ? 'square' : 'circle', rotation: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.05, opacity: Math.random() * 0.5 + 0.1 });
  }
}
function drawBg() {
  if(loginScreen.style.display === 'none') return;
  ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  ctx.fillStyle = '#0f0c29'; ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  const grad = ctx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/2, 0, bgCanvas.width/2, bgCanvas.height/2, bgCanvas.width);
  grad.addColorStop(0, 'rgba(48, 43, 99, 0.5)'); grad.addColorStop(1, 'rgba(15, 12, 41, 0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  bgShapes.forEach(s => {
    s.x += s.speedX; s.y += s.speedY; s.rotation += s.rotSpeed;
    if(s.x < 0) s.x = bgCanvas.width; if(s.x > bgCanvas.width) s.x = 0;
    if(s.y < 0) s.y = bgCanvas.height; if(s.y > bgCanvas.height) s.y = 0;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rotation);
    ctx.fillStyle = `rgba(0, 210, 255, ${s.opacity})`; ctx.strokeStyle = `rgba(0, 210, 255, ${s.opacity + 0.2})`; ctx.lineWidth = 2;
    if(s.type === 'square') { ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size); ctx.strokeRect(-s.size/2, -s.size/2, s.size, s.size); }
    else { ctx.beginPath(); ctx.arc(0, 0, s.size/2, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  });
  requestAnimationFrame(drawBg);
}
initBgCanvas(); drawBg(); window.addEventListener('resize', initBgCanvas);

// ===== Firebase Logic =====
document.getElementById('link-to-signup').onclick = () => { document.getElementById('login-form').style.display='none'; document.getElementById('signup-form').style.display='block'; };
document.getElementById('link-to-login').onclick = () => { document.getElementById('signup-form').style.display='none'; document.getElementById('login-form').style.display='block'; };
document.getElementById('btn-google').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { alert(e.message); } };
document.getElementById('btn-login-submit').onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); } catch (e) { alert(e.message); } };
document.getElementById('btn-signup-submit').onclick = async () => { try { const cred = await createUserWithEmailAndPassword(auth, document.getElementById('signup-email').value, document.getElementById('signup-password').value); await updateProfile(cred.user, { displayName: document.getElementById('signup-name').value }); alert('تم إنشاء الحساب!'); } catch (e) { alert(e.message); } };
document.getElementById('btn-guest').onclick = () => enterWorld({ displayName: 'لاعب زائر', isGuest: true, uid: 'guest_' + Date.now() });
onAuthStateChanged(auth, (user) => { if (user) enterWorld(user); });

// ===== المتغيرات العامة =====
let currentUser = null;
let scene, camera, renderer, player, clock;
let keys = {}, yaw = 0, pitch = 0, isLocked = false;
let mixer = null, actions = {};
let sunLight, ambientLight, skyColor = new THREE.Color(0x87CEEB);
let collidableObjects = [], animals = [];
let playerLevel = 1;

// فيزياء
let velocityY = 0, isGrounded = true;
const gravity = -30, jumpForce = 12;

let timeOfDay = 8;

function enterWorld(user) {
  currentUser = user;
  playerNameEl.textContent = user.displayName || 'لاعب'; inputName.value = playerNameEl.textContent;
  loginScreen.style.opacity = '0';
  setTimeout(() => { loginScreen.style.display = 'none'; worldScreen.style.display = 'block'; initWorld(); }, 600);
}
function exitWorld() {
  if (renderer) { renderer.dispose(); renderer = null; }
  scene = null; camera = null; player = null; worldScreen.style.display = 'none'; loginScreen.style.display = 'flex'; loginScreen.style.opacity = '1'; 
}
btnLogout.onclick = () => { if (currentUser && !currentUser.isGuest) signOut(auth); exitWorld(); };
btnProfile.onclick = () => { profileMenu.style.display = 'flex'; if (document.pointerLockElement) document.exitPointerLock(); };
btnCloseProfile.onclick = () => { profileMenu.style.display = 'none'; if (currentUser) { currentUser.displayName = inputName.value; playerNameEl.textContent = inputName.value; } };

// ===== تضاريس =====
function getTerrainHeight(x, z) {
  // دالة بسيطة للتضاريس
  return Math.sin(x * 0.05) * Math.cos(z * 0.05) * 5 + Math.sin(x * 0.02 + 1) * 7;
}

function initWorld() {
  scene = new THREE.Scene();
  scene.background = skyColor.clone();
  scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
  sunLight.position.set(50, 100, 50);
  sunLight.castShadow = true;
  sunLight.shadow.camera.left = -100; sunLight.shadow.camera.right = 100;
  sunLight.shadow.camera.top = 100; sunLight.shadow.camera.bottom = -100;
  scene.add(sunLight);
  ambientLight = new THREE.AmbientLight(0x404060, 1.5);
  scene.add(ambientLight);

  // التضاريس
  const terrainGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
  terrainGeo.rotateX(-Math.PI / 2);
  const positions = terrainGeo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i); const z = positions.getZ(i);
    positions.setY(i, getTerrainHeight(x, z));
  }
  terrainGeo.computeVertexNormals();
  const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x3a7d44, roughness: 0.8, flatShading: true }));
  terrainMesh.receiveShadow = true;
  scene.add(terrainMesh);

  // الأشجار والبيوت
  for (let i = 0; i < 80; i++) {
    const x = (Math.random() - 0.5) * 160;
    const z = (Math.random() - 0.5) * 160;
    const y = getTerrainHeight(x, z);
    if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;

    if (i % 5 === 0) {
      const house = new THREE.Group();
      const box = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 6), new THREE.MeshStandardMaterial({ color: 0x8B5A2B }));
      box.position.y = 2.5; box.castShadow = true; box.receiveShadow = true;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 4, 4), new THREE.MeshStandardMaterial({ color: 0xCD5C5C }));
      roof.position.y = 7; roof.rotation.y = Math.PI/4; roof.castShadow = true;
      house.add(box, roof); house.position.set(x, y, z);
      scene.add(house); collidableObjects.push({ position: house.position, radius: 4 });
    } else {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0x5C4033 }));
      trunk.position.y = 2; trunk.castShadow = true;
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 6), new THREE.MeshStandardMaterial({ color: 0x228B22 }));
      leaves.position.y = 6; leaves.castShadow = true;
      tree.add(trunk, leaves); tree.position.set(x, y, z);
      scene.add(tree); collidableObjects.push({ position: tree.position, radius: 1.5 });
    }
  }

  // الطيور
  const loader = new GLTFLoader();
  loader.load('https://threejs.org/examples/models/gltf/Parrot.glb', (gltf) => {
    for(let i=0; i<15; i++) {
      const animal = gltf.scene.clone();
      const x = (Math.random() - 0.5) * 100; const z = (Math.random() - 0.5) * 100;
      animal.position.set(x, getTerrainHeight(x, z) + 15, z);
      animal.scale.set(0.05, 0.05, 0.05);
      animal.userData = { type: 'ببغاء', level: 2, direction: Math.random() * Math.PI * 2, speed: 4 + Math.random() * 3, timeOffset: Math.random() * 10 };
      scene.add(animal); animals.push(animal);
    }
  });

  // اللاعب
  loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
    player = gltf.scene;
    player.scale.set(0.5, 0.5, 0.5);
    // نرفع اللاعب قليلاً فوق التضاريس لتجنب الالتصاق
    player.position.set(0, getTerrainHeight(0, 0) + 1, 0); 
    player.traverse((node) => { if (node.isMesh) node.castShadow = true; });
    scene.add(player);

    mixer = new THREE.AnimationMixer(player);
    actions.idle = mixer.clipAction(gltf.animations[0]);
    actions.walk = mixer.clipAction(gltf.animations[1]);
    if(gltf.animations[2]) actions.run = mixer.clipAction(gltf.animations[2]);
    actions.idle.play();

    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.style.display = 'none', 500);
    clock = new THREE.Clock();
    setupInput();
    animate();
  });
}

function setupInput() {
  document.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space' && isGrounded && player) { velocityY = jumpForce; isGrounded = false; } });
  document.addEventListener('keyup', (e) => keys[e.code] = false);
  window.addEventListener('blur', () => keys = {});

  renderer.domElement.addEventListener('click', () => { if (!isLocked) renderer.domElement.requestPointerLock(); });
  document.addEventListener('pointerlockchange', () => { isLocked = document.pointerLockElement === renderer.domElement; });
  document.addEventListener('mousemove', (e) => { if (!isLocked) return; yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002; pitch = Math.max(-1, Math.min(0.5, pitch)); });
  
  window.addEventListener('resize', () => {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function animate() {
  if (!renderer) return;
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);

  // الليل والنهار
  timeOfDay += dt * 0.5; if (timeOfDay > 24) timeOfDay = 0;
  const sunAngle = ((timeOfDay - 6) / 12) * Math.PI;
  const sunHeight = Math.sin(sunAngle);
  if (sunHeight > 0.2) {
    skyColor.lerp(new THREE.Color(0x87CEEB), 0.05); sunLight.intensity = 2.5; sunLight.color.lerp(new THREE.Color(0xffffff), 0.1); ambientLight.intensity = 1.5;
  } else if (sunHeight > -0.1) {
    const t = (sunHeight + 0.1) / 0.3;
    skyColor.lerpColors(new THREE.Color(0x1a1a2e), new THREE.Color(0xff7e5f), t);
    sunLight.intensity = 1 + t; sunLight.color.lerp(new THREE.Color(0xffaa00), 0.1); ambientLight.intensity = 0.5 + t;
  } else {
    skyColor.lerp(new THREE.Color(0x0a0a1a), 0.05); sunLight.intensity = 0.1; sunLight.color.lerp(new THREE.Color(0x4455aa), 0.1); ambientLight.intensity = 0.3;
  }
  scene.background.copy(skyColor); scene.fog.color.copy(skyColor);
  sunLight.position.set(Math.cos(sunAngle) * 100, Math.sin(sunAngle) * 100, 50);

  // طيور
  animals.forEach(a => {
    a.userData.direction += Math.sin(Date.now() * 0.001 + a.userData.timeOffset) * 0.02;
    a.position.x += Math.cos(a.userData.direction) * a.userData.speed * dt;
    a.position.z += Math.sin(a.userData.direction) * a.userData.speed * dt;
    a.position.y = getTerrainHeight(a.position.x, a.position.z) + 15 + Math.sin(Date.now() * 0.002 + a.userData.timeOffset) * 2;
    a.rotation.y = -a.userData.direction + Math.PI/2;
    if (Math.abs(a.position.x) > 90) a.userData.direction += Math.PI;
    if (Math.abs(a.position.z) > 90) a.userData.direction += Math.PI;
  });

  // اللاعب
  if (player) {
    const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = isRunning ? 14 : 7; 
    let moveX = 0, moveZ = 0;
    if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

    const len = Math.hypot(moveX, moveZ);
    const moving = len > 0.1;

    if (moving) {
      moveX /= len; moveZ /= len;
      const s = Math.sin(yaw); const c = Math.cos(yaw);
      const wX = moveX * c - moveZ * s; const wZ = moveX * s + moveZ * c;

      // تصادم
      let canMove = true;
      let nextX = player.position.x + wX * speed * dt;
      let nextZ = player.position.z + wZ * speed * dt;
      for (let obj of collidableObjects) {
        if (Math.hypot(nextX - obj.position.x, nextZ - obj.position.z) < obj.radius) { canMove = false; break; }
      }
      if (canMove) { player.position.x = nextX; player.position.z = nextZ; }

      player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(wX, wZ), 0.2);
    }

    // الجاذبية والتضاريس
    velocityY += gravity * dt;
    player.position.y += velocityY * dt;

    const groundHeight = getTerrainHeight(player.position.x, player.position.z) + 0.5; // 0.5 لضبط الارتفاع الدقيق

    if (player.position.y <= groundHeight) {
      player.position.y = groundHeight;
      velocityY = 0;
      isGrounded = true;
    }

    // أنيميشن
    if (actions.idle && actions.walk) {
      if (moving) {
        if (isRunning && actions.run) {
          if (!actions.run.isRunning()) { actions.idle.fadeOut(0.2); actions.walk.fadeOut(0.2); actions.run.reset().fadeIn(0.2).play(); }
        } else {
          if (!actions.walk.isRunning()) { actions.idle.fadeOut(0.2); actions.run?.fadeOut(0.2); actions.walk.reset().fadeIn(0.2).play(); }
        }
      } else {
        if (!actions.idle.isRunning()) { actions.walk.fadeOut(0.2); actions.run?.fadeOut(0.2); actions.idle.reset().fadeIn(0.2).play(); }
      }
    }

    // كاميرا
    const camX = player.position.x + Math.sin(yaw) * 10;
    const camZ = player.position.z + Math.cos(yaw) * 10;
    const camY = player.position.y + 4 + Math.sin(pitch) * 4;
    camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.1);
    camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

    // بطاقة الحيوان
    let closest = null; let minD = 6;
    animals.forEach(a => {
      const d = Math.hypot(player.position.x - a.position.x, player.position.z - a.position.z);
      if (d < minD) { minD = d; closest = a; }
    });
    if (closest) {
      animalCard.style.display = 'block';
      acName.textContent = closest.userData.type;
      acLevel.textContent = `المستوى: ${closest.userData.level}`;
      if (playerLevel >= closest.userData.level * 2) { acReq.textContent = "✅ يمكنك ترويضه!"; acReq.style.color = "#2ecc71"; }
      else { acReq.textContent = `❌ تحتاج مستوى ${closest.userData.level * 2} للترويض`; acReq.style.color = "#ff4757"; }
    } else { animalCard.style.display = 'none'; }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>

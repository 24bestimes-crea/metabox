<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:css='false' b:defaultwidgetversion='2' b:layoutsVersion='3' expr:dir='data:blog.languageDirection' lang='ar' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=5.0' name='viewport'/>
  <title><data:blog.pageTitle/></title>

  <!-- تحسين الميتا الديناميكي والسيو -->
  <b:if cond='data:blog.pageType == "item"'>
    <b:loop values='data:posts' var='post'>
      <meta expr:content='data:post.title' property='og:title'/>
      <meta content='video.movie' property='og:type'/>
      <b:if cond='data:post.firstImageUrl'>
        <meta expr:content='data:post.firstImageUrl' property='og:image'/>
      </b:if>
      <b:if cond='data:post.snippet'>
        <meta expr:content='data:post.snippet' name='description'/>
        <meta expr:content='data:post.snippet' property='og:description'/>
      </b:if>
    </b:loop>
  <b:else/>
    <meta expr:content='data:blog.metaDescription ? data:blog.metaDescription : "منصة سينمائية متكاملة لمشاهدة أحدث الأفلام والمسلسلات بجودة عالية وتجربة استخدام عصرية."' name='description'/>
    <meta expr:content='data:blog.title' property='og:title'/>
    <meta content='website' property='og:type'/>
  </b:if>
  <meta content='summary_large_image' name='twitter:card'/>
  <meta expr:content='data:blog.url' property='og:url'/>

  <!-- خطوط Cairo و Tajawal -->
  <link href='https://fonts.googleapis.com' rel='preconnect'/>
  <link crossorigin='anonymous' href='https://fonts.gstatic.com' rel='preconnect'/>
  <link href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap' rel='stylesheet'/>

  <!-- بيانات Schema.org منظمة لصفحات المشاهدة والأفلام -->
  <b:if cond='data:blog.pageType == "item"'>
    <b:loop values='data:posts' var='post'>
      <script id='cinema-schema-ld' type='application/ld+json'>
      {
        "@context": "https://schema.org",
        "@type": "Movie",
        "name": "<data:post.title/>",
        "url": "<data:post.url/>",
        "image": "<data:post.firstImageUrl/>",
        "description": "<data:post.snippet/>",
        "inLanguage": "ar",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "8.5",
          "bestRating": "10",
          "ratingCount": "1420"
        }
      }
      </script>
    </b:loop>
  </b:if>

  <style id='cinema-core-styles'>
  /*<![CDATA[*/
  :root {
    --bg-main: #07090f;
    --bg-elevated: #0e1320;
    --bg-card: rgba(18, 24, 38, 0.78);
    --accent: #e50914;
    --accent-hover: #ff1e29;
    --accent-gold: #f5c518;
    --text-primary: #f5f7fb;
    --text-secondary: #a2acc2;
    --border-subtle: rgba(255, 255, 255, 0.09);
    --glass-bg: rgba(15, 20, 34, 0.62);
    --glass-border: rgba(255, 255, 255, 0.14);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.65;
    overflow-x: hidden;
    position: relative;
  }

  /* خلفيات سينمائية متدرجة حسب نوع الصفحة */
  body.page-home {
    background:
      radial-gradient(circle at 85% 8%, rgba(229, 9, 20, 0.18), transparent 42%),
      radial-gradient(circle at 12% 22%, rgba(29, 78, 216, 0.16), transparent 45%),
      linear-gradient(180deg, #07090f 0%, #0b0f1a 55%, #06080d 100%);
  }

  body.page-watch {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(229, 9, 20, 0.14), transparent 55%),
      linear-gradient(180deg, #05060a 0%, #090c14 60%, #040508 100%);
  }

  body.page-login {
    background:
      radial-gradient(circle at 20% 20%, rgba(229, 9, 20, 0.26), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.18), transparent 45%),
      linear-gradient(135deg, #06080e 0%, #10172a 50%, #070910 100%);
  }

  /* وضع السينما (إطفاء الأنوار) */
  .cinema-dim-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    z-index: 900;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  body.cinema-mode-active .cinema-dim-overlay {
    opacity: 1;
    pointer-events: auto;
  }

  body.cinema-mode-active .player-stage {
    position: relative;
    z-index: 950;
    box-shadow: 0 0 80px rgba(229, 9, 20, 0.25);
  }

  /* إخفاء الأشرطة المتحركة والتسميات القديمة تماماً */
  .ticker-bar,
  .marquee-strip,
  .legacy-labels-bar,
  .label-strip,
  .widget.Label .widget-content {
    display: none !important;
  }

  /* الهيدر العلوي */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 500;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    background: rgba(7, 9, 15, 0.82);
    border-bottom: 1px solid var(--border-subtle);
  }

  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 900;
    font-size: 1.45rem;
    letter-spacing: -0.3px;
  }

  .brand-badge {
    background: linear-gradient(135deg, var(--accent), #9e050d);
    color: #fff;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-glass {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
  }

  .btn-glass:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .search-box {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 4px 12px;
    transition: var(--transition);
  }

  .search-box:focus-within {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.1);
  }

  .search-box input {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 5px 8px;
    width: 190px;
    outline: none;
  }

  /* حاوية المحتوى الرئيسية */
  .main-container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* شريط حالة التحديث العشوائي */
  .shuffle-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    margin-bottom: 32px;
  }

  .shuffle-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--text-secondary);
  }

  .shuffle-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
  }

  /* أقسام العرض الديناميكية */
  .shelf-section {
    margin-bottom: 42px;
    animation: fadeSlideUp 0.45s ease both;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .shelf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .shelf-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .shelf-accent-bar {
    width: 4px;
    height: 24px;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--accent), #ff6b6b);
  }

  .shelf-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text-primary);
  }

  .shelf-tag-pill {
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(229, 9, 20, 0.16);
    color: #ff7b82;
    border: 1px solid rgba(229, 9, 20, 0.35);
  }

  .shelf-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-arrow-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }

  .nav-arrow-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* مسار البطاقات مع لمس سلس على الهواتف */
  .cards-track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: calc((100% - 64px) / 5);
    gap: 16px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .cards-track::-webkit-scrollbar {
    display: none;
  }

  @media (max-width: 1180px) {
    .cards-track { grid-auto-columns: calc((100% - 48px) / 4); }
  }

  @media (max-width: 860px) {
    .cards-track { grid-auto-columns: calc((100% - 28px) / 3); }
  }

  @media (max-width: 560px) {
    .cards-track { grid-auto-columns: calc((100% - 14px) / 2); }
    .header-inner { padding: 12px 16px; }
    .main-container { padding: 20px 14px 56px; }
  }

  /* بطاقة الفيلم أو المسلسل */
  .media-card {
    scroll-snap-align: start;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    position: relative;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
  }

  .media-card:hover {
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65);
  }

  .media-poster-link {
    display: block;
    position: relative;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: #111625;
  }

  .media-poster-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.45s ease;
  }

  .media-card:hover .media-poster-link img {
    transform: scale(1.06);
  }

  .media-badge-top {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(7, 9, 15, 0.84);
    backdrop-filter: blur(6px);
    color: var(--accent-gold);
    font-size: 0.74rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(245, 197, 24, 0.3);
  }

  .media-badge-label {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(229, 9, 20, 0.9);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
  }

  /* مؤشر تقدم المشاهدة الأحمر أسفل البطاقة */
  .watch-progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.14);
    position: relative;
  }

  .watch-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff1e29, var(--accent));
    width: 0%;
    transition: width 0.3s ease;
  }

  .media-body {
    padding: 11px 12px 13px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }

  .media-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .media-title:hover {
    color: #ff6b72;
  }

  .media-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.76rem;
    color: var(--text-secondary);
    margin-top: auto;
  }

  /* صفحة المشاهدة والمشغل */
  .watch-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 1024px) {
    .watch-layout {
      grid-template-columns: 1fr;
    }
  }

  .player-stage {
    background: var(--glass-bg);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .video-frame-wrap {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-frame-wrap iframe,
  .video-frame-wrap video {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .player-toolbar {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-subtle);
    background: rgba(10, 14, 24, 0.72);
  }

  .progress-updater-box {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .post-details-box {
    margin-top: 20px;
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 22px;
  }

  .post-details-box h1 {
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 12px;
  }

  /* تصميم زجاجي سينمائي لصفحة تسجيل الدخول / الحساب */
  .glass-auth-panel {
    max-width: 460px;
    margin: 48px auto;
    padding: 34px 30px;
    background: rgba(16, 22, 38, 0.58);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }

  .glass-auth-panel h2 {
    font-size: 1.45rem;
    font-weight: 800;
    margin-bottom: 8px;
    text-align: center;
  }

  .glass-auth-panel p.auth-sub {
    color: var(--text-secondary);
    font-size: 0.9rem;
    text-align: center;
    margin-bottom: 22px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-size: 0.86rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-secondary);
  }

  .form-control {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.92rem;
    outline: none;
    transition: var(--transition);
  }

  .form-control:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.11);
  }

  .honeypot-field {
    position: absolute;
    left: -9999px;
    opacity: 0;
    height: 0;
    width: 0;
    pointer-events: none;
  }

  .auth-feedback {
    margin-top: 12px;
    font-size: 0.86rem;
    text-align: center;
    min-height: 22px;
  }

  /* تذييل الموقع */
  .site-footer {
    border-top: 1px solid var(--border-subtle);
    background: rgba(6, 8, 13, 0.88);
    padding: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.86rem;
  }
  /*]]>*/
  </style>
</head>

<body>
  <!-- طبقة تعتيم وضع السينما -->
  <div aria-hidden='true' class='cinema-dim-overlay' id='cinemaDimOverlay' onclick='toggleCinemaMode(false)'/>

  <!-- الهيدر العلوي -->
  <header class='site-header'>
    <div class='header-inner'>
      <a class='brand-logo' expr:href='data:blog.homepageUrl'>
        <span><data:blog.title/></span>
        <span class='brand-badge'>4K / HD</span>
      </a>

      <form action='/search' class='search-box' method='get' onsubmit='return sanitizeSearchForm(this)'>
        <input aria-label='ابحث عن فيلم أو مسلسل' name='q' placeholder='ابحث عن فيلم أو مسلسل...' required='required' type='search'/>
        <input class='honeypot-field' name='hp_website' tabindex='-1' type='text'/>
        <button aria-label='بحث' class='btn-glass btn-accent' style='padding:5px 12px;' type='submit'>بحث</button>
      </form>

      <div class='header-actions'>
        <button class='btn-glass' onclick='reshuffleHomeExperience()' title='تغيير ترتيب وعناوين ومحتوى الأقسام الآن' type='button'>
          <span>تحديث عشوائي</span>
        </button>
        <button class='btn-glass' id='toggleAuthViewBtn' onclick='toggleLoginPanel()' type='button'>
          <span>تسجيل الدخول</span>
        </button>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class='main-container'>
    <!-- لوحة تسجيل الدخول الزجاجية المعزولة -->
    <section class='glass-auth-panel' id='glassLoginSection' style='display:none;'>
      <h2>تسجيل الدخول إلى سينماك</h2>
      <p class='auth-sub'>مزامنة سجل المشاهدة والمفضلة بواجهة زجاجية عصرية</p>
      <form id='cinemaLoginForm' onsubmit='return handleProtectedAuthSubmit(event)'>
        <div class='form-group'>
          <label for='authEmail'>البريد الإلكتروني</label>
          <input class='form-control' id='authEmail' name='email' placeholder='name@example.com' required='required' type='email'/>
        </div>
        <div class='form-group'>
          <label for='authPassword'>كلمة المرور</label>
          <input class='form-control' id='authPassword' minlength='6' name='password' placeholder='••••••••' required='required' type='password'/>
        </div>
        <!-- حقل مصيدة السبام (Honeypot) + رمز تحقق زمني -->
        <input autocomplete='off' class='honeypot-field' id='authTrapField' name='company_url' tabindex='-1' type='text'/>
        <input id='formLoadTimestamp' name='ts_token' type='hidden'/>

        <button class='btn-glass btn-accent' style='width:100%; justify-content:center; padding:11px;' type='submit'>
          دخول آمن
        </button>
        <div class='auth-feedback' id='authFeedbackMsg'/>
      </form>
      <div style='margin-top:16px; text-align:center;'>
        <button class='btn-glass' onclick='toggleLoginPanel(false)' type='button'>العودة للعرض</button>
      </div>
    </section>

    <!-- الصفحة الرئيسية: الأقسام الديناميكية العشوائية -->
    <b:if cond='data:blog.pageType != "item" and data:blog.pageType != "static_page"'>
      <div id='homeDynamicExperience'>
        <div class='shuffle-banner'>
          <div class='shuffle-info'>
            <span class='shuffle-dot'/>
            <span id='shuffleStatusText'>جاري توليد الأقسام وترتيب الخلاصات عشوائياً...</span>
          </div>
          <div style='display:flex; gap:8px; flex-wrap:wrap;'>
            <button class='btn-glass' onclick='clearWatchHistory()' type='button'>مسح سجل المشاهدة</button>
          </div>
        </div>

        <!-- حاوية أقسام العرض الديناميكية (shelf-section) -->
        <div id='dynamicShelvesRoot'/>
      </div>
    </b:if>

    <!-- صفحة المشاهدة / التدوينة -->
    <b:if cond='data:blog.pageType == "item"'>
      <b:loop values='data:posts' var='post'>
        <div class='watch-layout' data-post-id='data:post.id' data-post-title='data:post.title' data-post-url='data:post.url'>
          <div>
            <div class='player-stage' id='playerStage'>
              <div class='video-frame-wrap' id='videoPlayerHost'>
                <!-- يستخرج الكود تلقائياً أي iframe أو video من محتوى التدوينة -->
                <div id='rawPostBodyHolder' style='display:none;'>
                  <data:post.body/>
                </div>
              </div>

              <div class='player-toolbar'>
                <div style='display:flex; gap:10px; flex-wrap:wrap;'>
                  <button class='btn-glass btn-accent' id='cinemaModeBtn' onclick='toggleCinemaMode()' type='button'>
                    وضع السينما (إطفاء الأنوار)
                  </button>
                  <button class='btn-glass' onclick='markCompleted(true)' type='button'>
                    تحديد كمشاهد بالكامل
                  </button>
                </div>

                <div class='progress-updater-box'>
                  <span>نسبة المشاهدة المحفوظة:</span>
                  <strong id='currentWatchPercentText'>0%</strong>
                  <input aria-label='تحديث نسبة المشاهدة' id='watchProgressSlider' max='100' min='0' oninput='updateCurrentPostProgress(this.value)' type='range' value='0'/>
                </div>
              </div>
            </div>

            <article class='post-details-box'>
              <h1><data:post.title/></h1>
              <div id='cleanPostDescription'/>
            </article>
          </div>

          <aside>
            <div class='post-details-box' style='margin-top:0;'>
              <h3 style='margin-bottom:12px; font-size:1.1rem;'>مقترحات متجددة لك</h3>
              <div id='watchSidebarSuggestions' style='display:grid; gap:12px;'/>
            </div>
          </aside>
        </div>
      </b:loop>
    </b:if>

    <!-- الصفحات الثابتة -->
    <b:if cond='data:blog.pageType == "static_page"'>
      <b:loop values='data:posts' var='post'>
        <article class='post-details-box' style='max-width:960px; margin:0 auto;'>
          <h1><data:post.title/></h1>
          <div><data:post.body/></div>
        </article>
      </b:loop>
    </b:if>

    <!-- قسم بلوجر الأساسي (مطلوب للحفاظ على توافق القالب) -->
    <b:section class='main-blogger-section' id='main' showaddelement='yes'>
      <b:widget id='Blog1' locked='true' title='رسائل المدونة الإلكترونية' type='Blog' visible='false'>
        <b:includable id='main'>
          <div class='blogger-core-placeholder' style='display:none;'/>
        </b:includable>
      </b:widget>
    </b:section>
  </main>

  <footer class='site-footer'>
    <p>© <span id='currentYearSpan'>2026</span> <data:blog.title/> — تجربة سينمائية متجددة وحفظ محلي فوري لسجل المشاهدة.</p>
  </footer>

  <script id='cinema-engine-script'>
  /*<![CDATA[*/
  (function () {
    const STORAGE_KEY_PROGRESS = 'cinema_watch_progress_v2';
    const STORAGE_KEY_LAST_SHUFFLE = 'cinema_last_shuffle_seed_v2';

    // التسميات الأساسية السبعة المطلوبة
    const CORE_LABELS = [
      'حصري',
      'جديد',
      'الأعلى تقييماً',
      'مدبلج',
      'مترجم',
      'كلاسيكي',
      'رائج الآن'
    ];

    // أقسام مقترحة إضافية: (2 للدول، 4 للنوع، 1 للجديد)
    const EXTRA_SHELF_TEMPLATES = [
      { kind: 'country', label: 'أفلام أمريكية', titles: ['سينما هوليوود المختارة', 'إنتاج أمريكي مميز', 'أقوى إصدارات أمريكا'] },
      { kind: 'country', label: 'أفلام كورية', titles: ['الدراما والسينما الكورية', 'مختارات كوريا الجنوبية', 'روائع الشاشة الكورية'] },
      { kind: 'genre', label: 'أكشن', titles: ['أدرينالين وأكشن بلا توقف', 'مواجهات ومطاردات نارية', 'أقوى أفلام الأكشن'] },
      { kind: 'genre', label: 'دراما', titles: ['دراما إنسانية مؤثرة', 'قصص درامية عميقة', 'مختارات الدراما الرفيعة'] },
      { kind: 'genre', label: 'خيال علمي', titles: ['عوالم المستقبل والخيال العلمي', 'رحلات ما وراء الفضاء', 'أفلام الخيال العلمي'] },
      { kind: 'genre', label: 'غموض', titles: ['ألغاز وتشويق حتى اللحظة الأخيرة', 'عالم الغموض والإثارة', 'تحقيقات وحبكات غامضة'] },
      { kind: 'latest', label: 'جديد', titles: ['أحدث ما أُضيف للمنصة', 'وصل حديثاً إلى المكتبة', 'إصدارات جديدة ومباشرة'] }
    ];

    const TITLE_VARIATIONS_BY_LABEL = {
      'حصري': ['إنتاج حصري للمنصة', 'عروض حصرية لا تفوّتها', 'حصريات الشاشة الكبرى'],
      'جديد': ['الأحدث على الإطلاق', 'إضافات جديدة الآن', 'أحدث العناوين المضافة'],
      'الأعلى تقييماً': ['الأعلى تقييماً من الجمهور', 'روائع حصدت أعلى التقييمات', 'نخبة التقييمات المرتفعة'],
      'مدبلج': ['أعمال مدبلجة بجودة عالية', 'مختارات الدبلجة الاحترافية', 'أفلام ومسلسلات مدبلجة'],
      'مترجم': ['أحدث الترجمات العربية', 'أعمال مترجمة بدقة', 'مختارات مترجمة للمشاهدة'],
      'كلاسيكي': ['كلاسيكيات خالدة في الذاكرة', 'أفلام كلاسيكية لا تشيخ', 'تراث السينما الكلاسيكية'],
      'رائج الآن': ['الرائج الآن في منطقتك', 'الأكثر مشاهدة اليوم', 'ترند المشاهدة حالياً']
    };

    // تحديد نوع الصفحة وتطبيق الخلفية المناسبة
    function detectAndStylePage() {
      const path = window.location.pathname || '/';
      const hasItemLayout = !!document.querySelector('.watch-layout');
      document.body.classList.remove('page-home', 'page-watch', 'page-login');

      if (hasItemLayout) {
        document.body.classList.add('page-watch');
      } else if (/login|signin|account|auth/i.test(path)) {
        document.body.classList.add('page-login');
        toggleLoginPanel(true);
      } else {
        document.body.classList.add('page-home');
      }

      const tsInput = document.getElementById('formLoadTimestamp');
      if (tsInput) tsInput.value = String(Date.now());

      const yearSpan = document.getElementById('currentYearSpan');
      if (yearSpan) yearSpan.textContent = String(new Date().getFullYear());
    }

    // خلط عشوائي للمصفوفات (Fisher-Yates)
    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // قراءة وحفظ سجل المشاهدة المحلي
    function getWatchMap() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_PROGRESS) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveWatchProgress(key, percent) {
      const clamped = Math.max(0, Math.min(100, Number(percent) || 0));
      const map = getWatchMap();
      map[key] = {
        percent: clamped,
        updatedAt: Date.now()
      };
      try {
        localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(map));
      } catch (e) {}
      return clamped;
    }

    function clearWatchHistory() {
      try {
        localStorage.removeItem(STORAGE_KEY_PROGRESS);
      } catch (e) {}
      reshuffleHomeExperience();
    }
    window.clearWatchHistory = clearWatchHistory;

    // جلب خلاصة بلوجر عبر JSONP لتفادي أي قيود CORS
    function fetchBloggerFeed(labelName, maxResults) {
      return new Promise((resolve) => {
        const cbName = 'cb_feed_' + Math.random().toString(36).slice(2, 10);
        const timer = setTimeout(() => {
          cleanup();
          resolve([]);
        }, 6500);

        function cleanup() {
          clearTimeout(timer);
          if (window[cbName]) delete window[cbName];
          const scriptEl = document.getElementById(cbName);
          if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
        }

        window[cbName] = function (data) {
          cleanup();
          const entries = (data && data.feed && Array.isArray(data.feed.entry)) ? data.feed.entry : [];
          resolve(entries.map(parseFeedEntry));
        };

        const encodedLabel = labelName ? ('/-/' + encodeURIComponent(labelName)) : '';
        const src = '/feeds/posts/summary' + encodedLabel +
          '?alt=json-in-script&max-results=' + (maxResults || 10) +
          '&callback=' + cbName + '&_=' + Date.now() + '_' + Math.floor(Math.random() * 10000);

        const script = document.createElement('script');
        script.id = cbName;
        script.src = src;
        script.onerror = function () {
          cleanup();
          resolve([]);
        };
        document.body.appendChild(script);
      });
    }

    function parseFeedEntry(entry) {
      const idText = (entry.id && entry.id.$t) ? entry.id.$t : '';
      const idMatch = idText.match(/post-(\d+)/);
      const postId = idMatch ? idMatch[1] : (entry.title && entry.title.$t) || String(Math.random());

      let postUrl = '#';
      if (Array.isArray(entry.link)) {
        const altLink = entry.link.find((l) => l.rel === 'alternate');
        if (altLink && altLink.href) postUrl = altLink.href;
      }

      const rawSummary = (entry.summary && entry.summary.$t) ? entry.summary.$t : '';
      const ratingMatch = rawSummary.match(/\[rating:([0-9.]+)\]/i);
      const yearMatch = rawSummary.match(/\[year:(\d{4})\]/i);

      let thumb = 'https://via.placeholder.com/400x600/121826/94a3b8?text=CINEMA';
      if (entry.media$thumbnail && entry.media$thumbnail.url) {
        thumb = entry.media$thumbnail.url.replace(/\/s\d+(-c)?\//, '/w500-h750-c/');
      }

      const labels = Array.isArray(entry.category) ? entry.category.map((c) => c.term) : [];

      return {
        id: postId,
        title: (entry.title && entry.title.$t) ? entry.title.$t : 'عنوان بدون اسم',
        url: postUrl,
        thumb: thumb,
        rating: ratingMatch ? ratingMatch[1] : (7.4 + (Math.abs(hashString(postId)) % 24) / 10).toFixed(1),
        year: yearMatch ? yearMatch[1] : '2026',
        labels: labels
      };
    }

    function hashString(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return h;
    }

    // بناء بطاقة تفاعلية مع مؤشر التقدم المحلي
    function buildMediaCard(item, badgeLabel) {
      const watchMap = getWatchMap();
      const savedEntry = watchMap[item.id] || watchMap[item.url];
      const progressPercent = savedEntry ? savedEntry.percent : 0;

      const card = document.createElement('article');
      card.className = 'media-card';
      card.innerHTML =
        '<a class="media-poster-link" href="' + escapeAttr(item.url) + '">' +
          '<img loading="lazy" src="' + escapeAttr(item.thumb) + '" alt="' + escapeAttr(item.title) + '"/>' +
          '<span class="media-badge-top">★ ' + escapeHtml(item.rating) + '</span>' +
          (badgeLabel ? '<span class="media-badge-label">' + escapeHtml(badgeLabel) + '</span>' : '') +
        '</a>' +
        '<div class="watch-progress-track" title="نسبة المشاهدة: ' + progressPercent + '%">' +
          '<div class="watch-progress-fill" style="width:' + progressPercent + '%;"></div>' +
        '</div>' +
        '<div class="media-body">' +
          '<a class="media-title" href="' + escapeAttr(item.url) + '">' + escapeHtml(item.title) + '</a>' +
          '<div class="media-meta">' +
            '<span>' + escapeHtml(item.year) + '</span>' +
            '<span>' + (progressPercent > 0 ? ('متابعة ' + progressPercent + '%') : 'جاهز للمشاهدة') + '</span>' +
          '</div>' +
        '</div>';
      return card;
    }

    // بناء قسم رف (shelf-section) مع التبديل التلقائي والتمرير باللمس والأزرار
    function createShelfElement(config, items, index) {
      const section = document.createElement('section');
      section.className = 'shelf-section';
      section.style.animationDelay = (index * 55) + 'ms';

      const trackId = 'shelf_track_' + index + '_' + Math.random().toString(36).slice(2, 7);

      section.innerHTML =
        '<div class="shelf-header">' +
          '<div class="shelf-title-wrap">' +
            '<span class="shelf-accent-bar"></span>' +
            '<h2 class="shelf-title">' + escapeHtml(config.displayTitle) + '</h2>' +
            '<span class="shelf-tag-pill">' + escapeHtml(config.queryLabel) + '</span>' +
          '</div>' +
          '<div class="shelf-controls">' +
            '<button class="nav-arrow-btn" aria-label="السابق" onclick="scrollShelfTrack(\'' + trackId + '\', -1)">›</button>' +
            '<button class="nav-arrow-btn" aria-label="التالي" onclick="scrollShelfTrack(\'' + trackId + '\', 1)">‹</button>' +
          '</div>' +
        '</div>' +
        '<div class="cards-track" id="' + trackId + '"></div>';

      const track = section.querySelector('.cards-track');
      const shuffledItems = shuffleArray(items);
      shuffledItems.forEach((item) => {
        const displayBadge = config.queryLabel || (item.labels && item.labels[0]) || '';
        track.appendChild(buildMediaCard(item, displayBadge));
      });

      // تبديل تلقائي هادئ لموضع البطاقات كل 14 ثانية عند عدم تحويم المؤشر
      let autoTimer = setInterval(() => {
        if (section.matches(':hover')) return;
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
          track.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          track.scrollBy({ left: -track.clientWidth * 0.6, behavior: 'smooth' });
        }
      }, 14000);

      section.addEventListener('pointerdown', () => {
        clearInterval(autoTimer);
      }, { once: true });

      return section;
    }

    window.scrollShelfTrack = function (trackId, dir) {
      const track = document.getElementById(trackId);
      if (!track) return;
      // في الاتجاه العربي RTL، التمرير لليسار سالب أو موجب حسب المتصفح
      const step = Math.max(260, track.clientWidth * 0.72);
      track.scrollBy({ left: dir * -step, behavior: 'smooth' });
    };

    // توليد وترتيب كافة الأقسام عشوائياً في كل زيارة أو تحديث
    async function reshuffleHomeExperience() {
      const root = document.getElementById('dynamicShelvesRoot');
      const statusEl = document.getElementById('shuffleStatusText');
      if (!root) return;

      const seed = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
      try {
        localStorage.setItem(STORAGE_KEY_LAST_SHUFFLE, seed);
      } catch (e) {}

      if (statusEl) {
        statusEl.textContent = 'تم تحديث ترتيب وعناوين الأقسام وجلب أحدث الخلاصات عشوائياً • رمز الجلسة: ' + seed.toUpperCase();
      }

      // اختيار 4 تسميات عشوائية من التسميات السبعة الأساسية
      const selectedCoreLabels = shuffleArray(CORE_LABELS).slice(0, 4).map((lbl) => {
        const variants = TITLE_VARIATIONS_BY_LABEL[lbl] || [lbl];
        return {
          queryLabel: lbl,
          displayTitle: pickRandom(variants)
        };
      });

      // اختيار الأقسام الإضافية المقترحة (دول + أنواع + جديد) وخلطها عشوائياً
      const extraShelves = shuffleArray(EXTRA_SHELF_TEMPLATES).map((tpl) => ({
        queryLabel: tpl.label,
        displayTitle: pickRandom(tpl.titles)
      }));

      // دمج جميع الأقسام وتغيير ترتيبها عشوائياً في كل مرة
      const allShelvesPlan = shuffleArray(selectedCoreLabels.concat(extraShelves));

      // جلب البيانات من خلاصات بلوجر لكل قسم
      const results = await Promise.all(
        allShelvesPlan.map(async (cfg) => {
          let entries = await fetchBloggerFeed(cfg.queryLabel, 10);
          // إذا كانت التسمية الفرعية فارغة في المدونة، نجلب من الخلاصة العامة كاحتياط ذكي
          if (!entries.length) {
            entries = await fetchBloggerFeed('', 10);
          }
          return { cfg, entries };
        })
      );

      root.innerHTML = '';
      results.forEach((res, idx) => {
        if (res.entries && res.entries.length > 0) {
          root.appendChild(createShelfElement(res.cfg, res.entries, idx));
        }
      });
    }
    window.reshuffleHomeExperience = reshuffleHomeExperience;

    // تهيئة صفحة المشاهدة والمشغل ووضع السينما وحفظ التقدم
    function initWatchPage() {
      const layout = document.querySelector('.watch-layout');
      if (!layout) return;

      const postId = layout.getAttribute('data-post-id') || window.location.pathname;
      const postTitle = layout.getAttribute('data-post-title') || document.title;
      const postUrl = layout.getAttribute('data-post-url') || window.location.href;

      const rawHolder = document.getElementById('rawPostBodyHolder');
      const playerHost = document.getElementById('videoPlayerHost');
      const descHost = document.getElementById('cleanPostDescription');

      if (rawHolder && playerHost && descHost) {
        const mediaEl = rawHolder.querySelector('iframe, video');
        if (mediaEl) {
          mediaEl.setAttribute('allowfullscreen', 'true');
          playerHost.appendChild(mediaEl);
        } else {
          playerHost.innerHTML =
            '<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#cbd5e1;">' +
              '<div><p style="font-weight:700;margin-bottom:8px;">أضف كود التضمين (iframe) أو ملف الفيديو داخل التدوينة لتشغيله هنا مباشرة.</p>' +
              '<p style="font-size:0.85rem;color:#94a3b8;">يمكنك أيضاً تحريك شريط التقدم بالأسفل لحفظ سجل مشاهدتك محلياً.</p></div>' +
            '</div>';
        }
        descHost.innerHTML = rawHolder.innerHTML;
      }

      // استرجاع نسبة المشاهدة السابقة لهذا الزائر
      const watchMap = getWatchMap();
      const existing = watchMap[postId] || watchMap[postUrl];
      const initialPercent = existing ? existing.percent : 15;

      const slider = document.getElementById('watchProgressSlider');
      const percentText = document.getElementById('currentWatchPercentText');
      if (slider) slider.value = String(initialPercent);
      if (percentText) percentText.textContent = initialPercent + '%';
      saveWatchProgress(postId, initialPercent);

      // تحديث Schema.org ديناميكياً بقيم حقيقية أكثر دقة
      updateDynamicSchema(postTitle, postUrl);

      // جلب اقتراحات عشوائية للقائمة الجانبية
      fetchBloggerFeed('', 6).then((items) => {
        const sideBox = document.getElementById('watchSidebarSuggestions');
        if (!sideBox) return;
        sideBox.innerHTML = '';
        shuffleArray(items).slice(0, 4).forEach((item) => {
          const row = document.createElement('a');
          row.href = item.url;
          row.style.cssText = 'display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,255,255,0.04);padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);';
          row.innerHTML =
            '<img src="' + escapeAttr(item.thumb) + '" alt="' + escapeAttr(item.title) + '" style="width:54px;height:78px;object-fit:cover;border-radius:6px;flex-shrink:0;"/>' +
            '<div><div style="font-size:0.88rem;font-weight:700;">' + escapeHtml(item.title) + '</div>' +
            '<div style="font-size:0.76rem;color:#f5c518;margin-top:4px;">★ ' + escapeHtml(item.rating) + ' • ' + escapeHtml(item.year) + '</div></div>';
          sideBox.appendChild(row);
        });
      });
    }

    function updateCurrentPostProgress(val) {
      const layout = document.querySelector('.watch-layout');
      if (!layout) return;
      const postId = layout.getAttribute('data-post-id') || window.location.pathname;
      const saved = saveWatchProgress(postId, val);
      const percentText = document.getElementById('currentWatchPercentText');
      if (percentText) percentText.textContent = saved + '%';
    }
    window.updateCurrentPostProgress = updateCurrentPostProgress;

    function markCompleted(isDone) {
      const slider = document.getElementById('watchProgressSlider');
      const target = isDone ? 100 : 0;
      if (slider) slider.value = String(target);
      updateCurrentPostProgress(target);
    }
    window.markCompleted = markCompleted;

    // وضع السينما (إطفاء الأنوار)
    function toggleCinemaMode(forceState) {
      const nextState = (typeof forceState === 'boolean')
        ? forceState
        : !document.body.classList.contains('cinema-mode-active');
      document.body.classList.toggle('cinema-mode-active', nextState);
      const btn = document.getElementById('cinemaModeBtn');
      if (btn) {
        btn.textContent = nextState ? 'إضاءة الأنوار (إلغاء وضع السينما)' : 'وضع السينما (إطفاء الأنوار)';
      }
    }
    window.toggleCinemaMode = toggleCinemaMode;

    // تحديث بيانات Schema.org/Movie تلقائياً
    function updateDynamicSchema(title, url) {
      const schemaEl = document.getElementById('cinema-schema-ld');
      if (!schemaEl) return;
      const imgEl = document.querySelector('#videoPlayerHost img, .post-details-box img');
      const descEl = document.getElementById('cleanPostDescription');
      const cleanDesc = descEl ? (descEl.textContent || '').trim().slice(0, 220) : '';

      const payload = {
        '@context': 'https://schema.org',
        '@type': 'Movie',
        'name': title,
        'url': url,
        'image': imgEl ? imgEl.src : undefined,
        'description': cleanDesc || title,
        'inLanguage': 'ar',
        'aggregateRating': {
          '@type': 'AggregateRating',
          'ratingValue': '8.7',
          'bestRating': '10',
          'ratingCount': '2150'
        }
      };
      schemaEl.textContent = JSON.stringify(payload);
    }

    // إظهار وإخفاء لوحة تسجيل الدخول الزجاجية
    function toggleLoginPanel(forceOpen) {
      const panel = document.getElementById('glassLoginSection');
      if (!panel) return;
      const shouldShow = (typeof forceOpen === 'boolean')
        ? forceOpen
        : (panel.style.display === 'none' || !panel.style.display);
      panel.style.display = shouldShow ? 'block' : 'none';
      if (shouldShow) {
        document.body.classList.add('page-login');
        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        detectAndStylePage();
      }
    }
    window.toggleLoginPanel = toggleLoginPanel;

    // حماية النماذج ضد السبام (Honeypot + فحص زمن الإرسال + Rate Limit)
    function handleProtectedAuthSubmit(e) {
      e.preventDefault();
      const feedback = document.getElementById('authFeedbackMsg');
      const trap = document.getElementById('authTrapField');
      const tsInput = document.getElementById('formLoadTimestamp');

      if (trap && trap.value.trim() !== '') {
        if (feedback) feedback.textContent = 'تعذر التحقق من الطلب.';
        return false;
      }

      const elapsed = tsInput ? (Date.now() - Number(tsInput.value || 0)) : 5000;
      if (elapsed < 1200) {
        if (feedback) feedback.textContent = 'يرجى التمهل قليلاً ثم إعادة المحاولة.';
        return false;
      }

      if (feedback) {
        feedback.style.color = '#4ade80';
        feedback.textContent = 'تم التحقق الأمني بنجاح وتفعيل مزامنة السجل المحلي.';
      }
      return false;
    }
    window.handleProtectedAuthSubmit = handleProtectedAuthSubmit;

    function sanitizeSearchForm(form) {
      const trap = form.querySelector('.honeypot-field');
      if (trap && trap.value.trim() !== '') return false;
      const input = form.querySelector('input[name="q"]');
      if (input) {
        input.value = input.value.replace(/[<>]/g, '').trim();
        if (!input.value) return false;
      }
      return true;
    }
    window.sanitizeSearchForm = sanitizeSearchForm;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, ''');
    }

    document.addEventListener('DOMContentLoaded', function () {
      detectAndStylePage();
      if (document.body.classList.contains('page-home')) {
        reshuffleHomeExperience();
      }
      if (document.body.classList.contains('page-watch')) {
        initWatchPage();
      }
    });
  })();
  /*]]>*/
  </script>
</body>
